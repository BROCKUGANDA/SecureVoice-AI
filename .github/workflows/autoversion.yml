# ---------------------------------------------------------------------------
# SecureVoice AI — automatic version and tag
#
#   green CI on main ─▶ tag vX.Y.Z (the version already in the tree) ─▶ push tag
#                      ─▶ Release workflow publishes the image + GitHub Release
#                      ─▶ bump PR for vX.Y.(Z+1) opened for the next release
#
# WHY A VERSION BUMP AUTOMATICALLY
#
# A release that a human has to remember to tag is a release that gets skipped,
# and the fix for "the tag is missing" is not discipline — it is removing the
# step. The tag is the only version authority in this repo (see release.yml),
# so producing it here means `main` always has a release and GHCR always has an
# image built from exactly that commit.
#
# THE LOOP, AND HOW IT IS BROKEN
#
# This workflow pushes a commit to `main`. That commit would trigger CI, which
# would trigger this workflow again, forever.
#
# TWO GUARDS, AND WHAT EACH ONE IS FOR
#
#   1. `workflow_run` (CI/completed/main) — this job only starts AFTER CI
#      finishes on `main`, and refuses any upstream conclusion that is not
#      `success`. The previous `push` trigger raced CI: the gate read
#      check-runs while they were still queued (conclusion null) or while a
#      flaky run was red, so nearly every push refused and main went without
#      tags or releases. The upstream conclusion is known here, not guessed.
#
#   2. The tag-already-exists check — if `v<package.json version>` is already a
#      tag, this run cuts no new tag. It still ensures the bump PR for the next
#      version exists (see below), because that PR is the only way package.json
#      ever moves on: a run that exited outright here would leave a tagged main
#      stuck forever, which is exactly what happened before 2026-10-12. The
#      branch check makes the repeat runs no-ops.
#
# The version bump for the NEXT release travels as a `chore(release)` pull
# request, because `main` is protected ("changes must be made through a pull
# request") and a tag push — the thing that fires release.yml — is not a branch
# change. So: this workflow tags what is in the tree, and prepares the bump.
#
# It also runs ONLY on CI green, so a broken main cannot produce a release.
# ---------------------------------------------------------------------------
name: AutoVersion

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  # BOTH are required, and each was once the only one named — which is how this
  # ended up broken twice:
  #
  #  · `checks: read` is what the CI-green gate below calls. Naming ONLY
  #    `contents: write` implicitly sets every unnamed permission to none, so
  #    the `check-runs` read returned 403 and the job could never prove CI was
  #    green at all.
  #
  #  · `contents: write` is what the two `git push` lines at the end need — the
  #    bump commit and the `vX.Y.Z` tag. Naming ONLY `checks: read` left the
  #    token read-only, so the bump committed and tagged LOCALLY and then died
  #    on `git push origin main` with
  #    `remote: Permission to BROCKUGANDA/SecureVoice-AI.git denied to
  #     github-actions[bot]` / 403. Nothing was released: package.json on main
  #    stayed at the old version and no tag existed.
  #
  # Granting only one of these makes this workflow fail in a different place
  # each time, so both are named explicitly and neither is implied.
  checks: read
  contents: write

# One bump at a time: two racing bumps would tag two versions off one commit.
concurrency:
  group: autoversion-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the version, tag, and release
    runs-on: [self-hosted, securevoice-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # The tag push below needs the tag to be creatable, and the bump needs
          # the tag list to know whether this version already shipped.
          fetch-depth: 0

      # Runs on the VPS runner (securevoice-vps) and calls
      # `bun scripts/bump-version.mjs` directly on the host. Same reasoning as
      # ci.yml: provision it here rather than assuming a manual install
      # happened, because a replaced runner would otherwise break the release.
      - name: Install Bun on the runner
        run: |
          if command -v bun >/dev/null 2>&1; then
            echo "bun already present: $(bun --version)"
            exit 0
          fi
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version

      # The gating rule. A release is a claim that this commit works, and this
      # is where that claim is checked rather than asserted. On the
      # `workflow_run` path the upstream conclusion is authoritative; the
      # check-runs read below is a second opinion on the exact commit.
      - name: Refuse to release a commit CI did not prove
        env:
          EVENT: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run: verifying CI on main is currently green"
          else
            [ "$UPSTREAM_CONCLUSION" = "success" ] || {
              echo "::error::upstream CI run concluded '${UPSTREAM_CONCLUSION}'. Production only releases what CI proved green."
              exit 1
            }
            echo "upstream CI run: success"
          fi
          # Second opinion, and deliberately narrow: only completed runs count,
          # so a queued twin can neither pass nor fail this gate, and only the
          # two required contexts are read, so unrelated red (code scanning,
          # a stale deploy) cannot veto a release. At least one completed
          # success and zero completed failures is green.
          code=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[]
                  | select((.name | startswith("Lint, typecheck"))
                        or (.name | startswith("Compose stack")))
                  | select(.status == "completed")]
                  | if length == 0 then "missing"
                    else (map(select(.conclusion != "success")) | if length == 0 then "success" else "failing" end)
                    end')
          echo "CI on $GITHUB_SHA: $code"
          [ "$code" = "success" ] || {
            echo "::error::CI is '${code}' for $GITHUB_SHA — refusing to cut a release."
            exit 1
          }

      - name: Bump package.json, commit and tag
        id: release
        env:
          # NOT secrets.GITHUB_TOKEN, and not just for consistency with the
          # promotion workflow. A push authenticated with GITHUB_TOKEN does not
          # trigger workflows BY DESIGN — that is GitHub's loop guard — so the
          # tag push below would be accepted, the commit would land, and the
          # tag-triggered Release job would never start. The release would look
          # like it worked and produce nothing. A repo-scoped token pushes as
          # the repository's own identity, so the tag fires the release.
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          GIT_AUTH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          # Point the push at the token explicitly. The checkout's persisted
          # credential is GITHUB_TOKEN, and pushing with it would land the
          # commit while silently not triggering the tag-driven release.
          git remote set-url origin \
            "https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # ...and clear the header that would override it. actions/checkout
          # persists `http.https://github.com/.extraheader` — an Authorization
          # header carried on every request to github.com — and that header
          # WINS over the token embedded in the remote URL above. Measured
          # 2026-10-12: v0.2.2's tag landed as github-actions[bot] despite the
          # set-url, GitHub's loop guard suppressed the tag push, and the
          # Release workflow never started — the tag and the Deployments were
          # visible while the Releases page stayed empty, which is exactly the
          # "I keep failing to see it on GitHub" symptom. Unsetting it here is
          # what actually makes GIT_AUTH_TOKEN the pushing identity.
          git config --unset-all "http.https://github.com/.extraheader" || true

          # Configure git identity: a workflow checkout has none, and a commit
          # without one fails with "unable to auto-detect email address".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current=$(node -p "require('./package.json').version")
          echo "current version: $current"

          # scripts/bump-version.mjs takes an EXPLICIT version and refuses
          # anything not strictly greater — the property worth keeping. It does
          # not compute the next version, so the patch increment happens here and
          # the script remains the thing that decides whether it is allowed.
          # Double quotes, and `$` escaped, so the template literal reaches node
          # intact instead of the shell expanding `${maj}` as a variable.
          next=$(node -e 'const [maj, min, pat] = process.argv[1].split(".").map(Number); console.log(maj + "." + min + "." + (pat + 1));' "$current")
          echo "next version: $next"

          # THE LOOP GUARD. A version that already has a tag is a version that
          # already shipped; tagging again would publish the same code twice
          # under two numbers and make "which build am I running?" unanswerable.
          #
          # Asked of the REMOTE, not with `git rev-parse`: actions/checkout
          # defaults to a shallow fetch that does not carry tag refs down, so a
          # local lookup answers "no such tag" for a version that shipped months
          # ago — turning the guard that prevents a double publish into the reason
          # one is attempted, or (once the push is refused) the reason this job is
          # red on every green main.
          #
          # THE GUARD SUPPRESSES THE TAG, NOT THE WORK. This block used to
          # `exit 0` when the version was already tagged, which left the ladder
          # with no way forward: package.json only ever moves on via the bump PR
          # below, so skipping that PR left a tagged main permanently stuck on
          # its current version — no next tag, no next release, nothing to see
          # on GitHub. That is not theoretical: on 2026-10-12 main sat at
          # v0.2.1, tagged, with no bump PR in existence, and no run of this
          # workflow (nor any other) could advance it. The already-tagged case
          # now falls through to the same bump-PR step as the tagging case; the
          # branch check there is idempotent, so repeats are no-ops.
          tagged=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$current" >/dev/null 2>&1; then
            echo "v$current is already tagged — no new tag this run."
          else
            tagged=true
          fi

          # Same command a human would run, so the one script that owns
          # package.json is the one that writes it. Its FIRST output line is
          # `version X -> Y`; verify that line actually appeared before
          # committing. (See the two-fault note below for why it is `head`,
          # and why the grep needs `--`.)
          #
          # Two bugs met here on 2026-10-10, and both had to be fixed together.
          #
          #  1. `tail -n 1` read the WRONG line. The script prints
          #     `version 0.2.1 -> 0.2.2` and THEN
          #     `next: git commit -am "chore: release v0.2.2" && …`. `tail -n 1`
          #     therefore selected the "next:" hint — or the trailing empty line
          #     — and never the confirmation line the check is looking for.
          #     `head -n 1` is the line that actually carries `X -> Y`.
          #
          #  2. The grep pattern BEGINS WITH A DASH. `grep -qF "-> $next"` parses
          #     `-> 0.2.2` as an option string and dies with
          #     `grep: invalid option -- '>'` before it ever looks at the input.
          #     The `--` separator ends option parsing and is what makes a
          #     leading-dash pattern reachable at all.
          #
          # Either bug alone aborts the release AFTER package.json was already
          # rewritten in the working tree but BEFORE any commit or tag, which is
          # the worst place to fail: the repo looks bumped and nothing is
          # released. Both are now covered by a test that runs the real script.
          # ── Why nothing here pushes a commit to main ─────────────────────────
          # `main` is protected by repository rules: "Changes must be made through
          # a pull request" and "2 of 2 required status checks are expected". This
          # step used to commit the bump and `git push origin main`, and GitHub
          # refused it with GH013 — so the tag never got created, the tag-triggered
          # Release job never ran, and the repository showed NO releases at all
          # while the VPS kept being deployed by hand. That is the whole reason
          # "I keep failing to see it on GitHub" was true.
          #
          # The protection is right and stays. The automation now lives inside it:
          #
          #   · the TAG names the version that is actually in the tree at this SHA,
          #     and pushing a tag ref is not a branch change — so the tag fires
          #     release.yml exactly as before, and the image, the GitHub Release
          #     page and `git describe` all agree about which code they name;
          #   · the package.json bump for the NEXT release travels the only
          #     sanctioned way in: a pull request.
          #
          # Tagging `$current` rather than `$next` is the point. A tag `v0.2.2`
          # pointing at a commit whose package.json says 0.2.1 is how "which build
          # am I running?" becomes unanswerable — the failure this job's own header
          # exists to prevent.
          version="$current"
          if [ "$tagged" = "true" ]; then
            git tag -a "v$version" -m "SecureVoice AI v$version"
            git push origin "refs/tags/v$version"
          fi

          # The bump PR, best-effort ON PURPOSE. On the tagging path the release
          # has already happened by now; a red job whose Release exists teaches
          # the next reader to distrust the badge, which is worse than a missing
          # bump PR. Every failure path here therefore reports and continues.
          # On the already-tagged path this block is the entire point of the
          # run — it is what unsticks a main that had no way to the next version.
          if git ls-remote --exit-code --heads origin "chore/release-v$next" >/dev/null 2>&1; then
            echo "chore/release-v$next already exists — not opening a second bump PR."
          else
            git checkout -b "chore/release-v$next"
            if bumped=$(bun scripts/bump-version.mjs "$next" | head -n 1) &&
               printf '%s' "$bumped" | grep -qF -- "-> $next"; then
              git add package.json
              # NO [skip ci], and that is load-bearing. main's protection
              # requires the two named status checks on every pull request, and
              # a workflow skipped by a commit message reports NO check run at
              # all — the PR sat at "Expected — waiting for status to be
              # reported" forever, so the bump could never be armed or merged
              # and the release chain stalled one step before the tag. The full
              # suite runs; that is the price of a protected main.
              git commit -m "chore(release): v$next"
              git push origin "chore/release-v$next"
              gh pr create --base main --head "chore/release-v$next" \
                --title "chore(release): v$next" \
                --body "Version bump created by AutoVersion after v$version was tagged. Merge it to make the next release v$next; leaving it open is harmless — the job reuses this branch." ||
                echo "::warning::could not open the bump PR for v$next; the release itself succeeded"
            else
              echo "::warning::bump-version.mjs refused $next (said: '${bumped:-<no output>}'); v$version is tagged and released, but the next bump needs a human."
              git checkout -- package.json 2>/dev/null || true
            fi
          fi

          if [ "$tagged" = "true" ]; then
            {
              echo "released=true"
              echo "version=$version"
            } >> "$GITHUB_OUTPUT"
            # `v$version` — the tag that was actually cut. This used to print
            # `v$next`, the NEXT version, which no artifact in existence carried.
            {
              echo "### Released v$version"
              echo ""
              echo "- tag: \`v$version\`"
              echo "- package: \`ghcr.io/$GITHUB_REPOSITORY:v$version\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            {
              echo "### v$version was already released — ensured the bump PR for v$next"
              echo ""
              echo "- tag (existing): \`v$version\`"
              echo "- next release: merge \`chore/release-v$next\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

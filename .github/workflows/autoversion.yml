# ---------------------------------------------------------------------------
# SecureVoice AI — automatic version and tag
#
#   green CI on main ─▶ patch bump package.json ─▶ commit ─▶ tag vX.Y.Z ─▶ push tag
#                      ─▶ Release workflow publishes the image + GitHub Release
#
# WHY A VERSION BUMP AUTOMATICALLY
#
# A release that a human has to remember to tag is a release that gets skipped,
# and the fix for "the tag is missing" is not discipline — it is removing the
# step. The tag is the only version authority in this repo (see release.yml),
# so producing it here means `main` always has a release and GHCR always has an
# image built from exactly that commit.
#
# WHY THIS RUNS ON `workflow_run`, NOT ON THE PUSH ITSELF
#
# The gate below proves CI is green for the commit before it bumps. Triggered by
# the push, this workflow would race CI: both start together, CI takes minutes,
# and the gate reads the commit's check-runs while CI is still running — an
# empty or in-progress list, which the gate must read as "not proven". Deploy hit
# the same wall and moved to `workflow_run` (see deploy.yml); this follows that
# pattern, so the gate only ever reads a finished CI run.
#
# THE COMMIT, NOT `main`
#
# The run that finishes proves ONE SHA. So this checks out that SHA, refuses if
# the checkout turned out to be something else, and pushes the tag back as
# `HEAD:main`. A release can never name a commit no CI run has seen, even when
# `main` moves in the seconds between CI finishing and this job starting.
#
# THE LOOP, AND HOW IT IS BROKEN
#
# This workflow pushes a commit to `main`. That commit would trigger CI, which
# would trigger this workflow again, forever. The guard is the commit's own tag:
# the release commit carries v<version>, so when this workflow runs for its own
# commit it finds HEAD already tagged and exits without bumping. A manual
# re-run, or a re-tag, produces no second bump for the same reason.
# ---------------------------------------------------------------------------
name: AutoVersion

on:
  # Only after CI finishes on `main`. A release is a claim that the commit
  # works, and this is the event that carries CI's verdict on that commit.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Manual re-run, for when the automatic path was skipped.
  workflow_dispatch:

permissions:
  # `checks: read` is what the manual path below calls. The `workflow_run` path
  # reads CI's verdict from the event, so it does not need it. Naming only
  # `contents: write` implicitly sets every other permission to none, so the
  # `check-runs` read returned 403 and the manual job could never prove CI was
  # green.
  checks: read
  contents: read

# One bump at a time: two racing bumps would tag two versions off one commit.
concurrency:
  group: autoversion-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the version, tag, and release
    runs-on: [self-hosted, securevoice-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI proved, never mutable `main`: `main` can advance
          # between CI finishing and this checkout, and bumping that newer
          # commit would tag — and hand PROMOTE_TOKEN to — code no CI run has
          # seen. A manual run has no upstream commit, so it takes `main`.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          # The tag push below needs the tag to be creatable, and the bump needs
          # the tag list to know whether this commit already shipped.
          fetch-depth: 0

      # The gating rule. A release is a claim that this commit works, and this
      # is where that claim is checked rather than asserted.
      - name: Refuse to release a commit CI did not prove
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run: verifying CI on main is currently green"
            # Every expected check must be present and green, and only the
            # LATEST attempt of each counts: a re-run adds a check run beside
            # the failed one instead of replacing it, so "any non-success"
            # would refuse a commit whose current CI is green.
            code=$(gh api "repos/$GITHUB_REPOSITORY/commits/main/check-runs?per_page=100" \
              --jq '[.check_runs[]
                    | select((.name | startswith("Lint, typecheck"))
                          or (.name | startswith("Compose stack")))]
                    | group_by(.name)
                    | map(sort_by(.started_at // "") | last)
                    | if length < 2 then "missing"
                      elif (map(select(.status == "completed" and .conclusion == "success")) | length) == length then "success"
                      else "failing"
                      end')
            echo "CI on main: $code"
            [ "$code" = "success" ] || {
              echo "::error::CI on main is '${code}' — refusing to cut a release."
              exit 1
            }
            exit 0
          fi

          # The `workflow_run` path: the event carries the CI run's verdict on
          # the commit that just finished, so no check-runs lookup is needed and
          # there is nothing to race. It also carries WHAT that run was — and
          # only a push to this repository proves a commit. A fork PR whose head
          # branch happens to be named `main`, or a manual CI dispatch, matches
          # `branches: [main]` too, and a fork run skips every job while still
          # reporting success.
          echo "CI run $RUN_ID ($RUN_EVENT on $RUN_REPO) concluded: $RUN_CONCLUSION"
          [ "$RUN_EVENT" = "push" ] || {
            echo "::error::CI run ${RUN_ID} was a '${RUN_EVENT}' run, not a push — refusing to cut a release."
            exit 1
          }
          [ "$RUN_REPO" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::CI run ${RUN_ID} ran on ${RUN_REPO}, not ${GITHUB_REPOSITORY} — refusing to cut a release."
            exit 1
          }
          [ "$RUN_CONCLUSION" = "success" ] || {
            echo "::error::CI run ${RUN_ID} concluded '${RUN_CONCLUSION}' — refusing to cut a release."
            exit 1
          }

      - name: Bump package.json, commit and tag
        id: release
        env:
          # The commit CI just finished on. Empty on a manual run.
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          # NOT secrets.GITHUB_TOKEN, and not just for consistency with the
          # promotion workflow. A push authenticated with GITHUB_TOKEN does not
          # trigger workflows BY DESIGN — that is GitHub's loop guard — so the
          # tag push below would be accepted, the commit would land, and the
          # tag-triggered Release job would never start. The release would look
          # like it worked and produce nothing. A repo-scoped token pushes as
          # the repository's own identity, so the tag fires the release.
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          GIT_AUTH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          # Point the push at the token explicitly. The checkout's persisted
          # credential is GITHUB_TOKEN, and pushing with it would land the
          # commit while silently not triggering the tag-driven release.
          git remote set-url origin \
            "https://x-access-token:${GIT_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Configure git identity: a workflow checkout has none, and a commit
          # without one fails with "unable to auto-detect email address".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The checkout above asked for RUN_SHA, but a ref is resolved by the
          # runner, not by us. Prove HEAD is the commit CI proved instead of
          # assuming it: everything below tags and pushes whatever is here.
          if [ -n "${RUN_SHA:-}" ] && [ "$(git rev-parse HEAD)" != "$RUN_SHA" ]; then
            echo "::error::checked out $(git rev-parse HEAD), expected CI's ${RUN_SHA} — refusing to cut a release."
            exit 1
          fi

          # THE LOOP GUARD. The release commit carries its version tag, so a run
          # for that commit finds HEAD already tagged and stops. It keys on the
          # COMMIT, not on package.json's version: keying on the version would
          # also stop the next green push — a fresh, untagged commit whose
          # package.json still holds the last released version — from ever
          # cutting a release again.
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already tagged — main is released, nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "### $(git tag --points-at HEAD | tr '\n' ' ') already tags this commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `workflow_run` cannot declare a path filter, so the `paths-ignore`
          # this workflow used to carry is re-checked here — over everything
          # since the last release, not just the tip commit. A push whose tip
          # touched only docs can still be carrying the code change that has not
          # shipped yet, and reading only the tip would lose that release. No
          # previous tag, or a diff that fails, does NOT skip either: a missed
          # release is worse than a noisy one.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [ -n "$prev" ]; then
            changed=$(git diff --name-only "$prev" HEAD || true)
            if [ -n "$changed" ] &&
               ! printf '%s\n' "$changed" | grep -qvE '^(package\.json$|.*\.md$|docs/|evidence/|\.github/workflows/autoversion\.yml$)'; then
              echo "nothing release-relevant since $prev — nothing to release."
              echo "released=false" >> "$GITHUB_OUTPUT"
              echo "### no release-relevant change since $prev" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          current=$(node -p "require('./package.json').version")
          echo "current version: $current"

          # scripts/bump-version.mjs takes an EXPLICIT version and refuses
          # anything not strictly greater — the property worth keeping. It does
          # not compute the next version, so the patch increment happens here and
          # the script remains the thing that decides whether it is allowed.
          # Double quotes, and `$` escaped, so the template literal reaches node
          # intact instead of the shell expanding `${maj}` as a variable.
          next=$(node -e 'const [maj, min, pat] = process.argv[1].split(".").map(Number); console.log(maj + "." + min + "." + (pat + 1));' "$current")
          echo "next version: $next"

          # Same command a human would run, so the one script that owns
          # package.json is the one that writes it. Its output ends with
          # "version X -> Y"; verify it actually applied before committing.
          bumped=$(bun scripts/bump-version.mjs "$next" | tail -n 1)
          if ! printf '%s' "$bumped" | grep -qF "-> $next"; then
            echo "::error::bump-version.mjs did not apply $next (said: '$bumped')"
            exit 1
          fi

          git add package.json
          git commit -m "chore(release): v$next"

          # Annotated, so `git describe` and the GitHub release page both carry
          # the commit this tag points at rather than a bare pointer.
          git tag -a "v$next" -m "SecureVoice AI v$next"

          # `HEAD:main`, not `main`: on the `workflow_run` path HEAD is the
          # detached commit CI proved and there is no local `main` ref to push.
          # If `main` has moved since, this push is rejected — which is the
          # point: that newer commit has its own CI run and its own release.
          git push origin HEAD:main
          # Follow tags, so the release workflow — which is tag-triggered —
          # actually starts. A plain `git push` leaves the tag behind and the
          # release silently never happens.
          git push origin "refs/tags/v$next"

          {
            echo "released=true"
            echo "version=$next"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Released v$next"
            echo ""
            echo "- tag: \`v$next\`"
            echo "- package: \`ghcr.io/$GITHUB_REPOSITORY:v$next\`"
          } >> "$GITHUB_STEP_SUMMARY"

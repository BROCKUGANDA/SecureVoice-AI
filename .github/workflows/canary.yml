# Automatic canary + blue-green rollout.
#
# WHAT THIS IS FOR
# ---------------
# `deploy.yml` rolls production. On a host that has adopted the blue/green
# slots it BUILDS, MIGRATES, rolls the shared workers and STAGES the release
# into the idle colour — proving the new colour is ready without moving any
# traffic. The old colour keeps serving 100% until this workflow runs.
#
# This workflow is the rest of that release: it widens the split, watches it,
# and either promotes it or rolls it back. It runs AUTOMATICALLY when a deploy
# succeeds, because a canary that somebody has to remember to run is a canary
# that does not run during the incident it was meant to protect against.
#
# "When a deploy succeeds" means EVERY deploy — a branch deploy and a release
# deploy alike. The release path used to be excluded from it by an accident of
# GitHub's event plumbing that nobody had measured: see the note on the
# trigger below.
#
# HOW IT RUNS
# -----------
#   stage → 5% → soak (edge + colour) → 50% → soak → 100% → verify → promote
#
# and on ANY red probe: the traffic is reverted to the colour that was already
# serving, inside the same command, before the workflow declares anything.
#
# WHEN IT DOES NOTHING
# --------------------
# On a host that has NOT adopted blue/green, the deploy rolled the plain `app`
# container and there is nothing to canary. This workflow then exits
# SUCCESSFULLY with a notice. That is deliberate: a canary workflow that goes
# red on every deploy of a plain host trains everyone to ignore it, and the
# one time it would have mattered is the one time it is ignored.
#
# THE ONE-TIME ADOPTION
# ---------------------
# Moving a live deployment from the plain stack to the colour slots changes
# which container serves production, so it is an OPERATOR step, not something
# this workflow does to itself:
#
#   cd ~/securevoice-ai && bun scripts/deploy.mjs adopt
#
# It stages the first colour on the build that is ALREADY serving, points the
# edge at it, proves the edge answers, and only then stops the plain
# container. If any step fails it reverts to the plain stack.
#
# Every input is passed through `env:` rather than interpolated into a `run:`
# string, so a value can never be read as shell syntax.
name: Canary

on:
  # THE AUTOMATIC TRIGGER IS A DISPATCH FROM THE DEPLOY, NOT `workflow_run`.
  #
  # It used to be `workflow_run` on the Deploy workflow, and that reached the
  # branch path and NOT the release path. Measured, twice, on 2026-10-22:
  #
  #   Deploy #39574133567  workflow_run      completed 09:06:45  -> Canary 09:06:49
  #   Deploy #39575714596  workflow_run      completed 09:19:26  -> Canary 09:19:28
  #   Deploy #39577117053  workflow_dispatch completed 09:28:42  -> (none)
  #   Deploy #39582683719  workflow_run      completed 10:12:45  -> Canary 10:12:47
  #   Deploy #39709642750  workflow_run      completed 02:11:04  -> Canary 02:11:06
  #   Deploy #39710620859  workflow_dispatch completed 02:30:28  -> (none)
  #
  # A canary appears 2-4 seconds after every `workflow_run` deploy and after
  # NEITHER `workflow_dispatch` deploy. GitHub emits no `workflow_run` event
  # for a run that was itself started by `workflow_dispatch`, and the release
  # path reaches the deploy exactly that way: `release.yml` dispatches
  # `deploy.yml` with the tag it just published, because `workflow_run` can
  # name only ONE upstream workflow and a release is not a CI run.
  #
  # So the release deploy staged the published image, proved it healthy, and
  # moved no traffic, and nothing widened it. The image sat there serving 0%
  # of the requests while the tag on the release page said it was the version
  # in production. It took a manual `gh workflow run canary.yml` to finish
  # v0.2.51, and the v0.2.50 release had needed the same thing — it only
  # appeared to work because an unrelated branch deploy's canary happened to
  # be widening the same colour at the time. That luck is recorded in the
  # comment at the concurrency group below.
  #
  # The fix is to have the ONE workflow that knows a release is staged and
  # ready — the deploy — hand it over. `deploy.yml` dispatches this workflow
  # as its last step, so a branch deploy and a release deploy reach the canary
  # the same way, and there is exactly ONE canary per deploy because there is
  # exactly ONE dispatcher.
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to roll out (sha, tag, or registry ref)"
        required: false
      # NO `default:` ON THE THREE NUMBERS, and that is load-bearing.
      #
      # A `workflow_dispatch` input WITH a default is always populated, so
      # `github.event.inputs.startPercent` would be "5" even when the
      # dispatcher passed nothing — and the step below would read the literal
      # in this file instead of the repository variable. That is how a
      # deployment's own canary ladder (CANARY_START_PERCENT and friends)
      # stops being read, silently, the first time the canary is dispatched
      # instead of triggered.
      #
      # With no default, an unset input is EMPTY, the `||` fallback in the
      # step takes the repository variable, and the variable's own shipped
      # default applies when the variable is not set. The values this
      # repository has been shipping (5 / 50 / 300) are unchanged.
      startPercent:
        description: "First canary split"
        required: false
      midPercent:
        description: "Second canary split before full rollout"
        required: false
      soakSeconds:
        description: "Seconds to observe each split before widening"
        required: false

permissions:
  contents: read

# THE SAME GROUP AS THE DEPLOY, AND IT MUST NOT CANCEL.
#
# A deploy that starts while a canary is mid-flight stages a release into a
# colour the canary is already widening, and the two fight over the traffic
# pointer. Measured 2026-10-21, on the first release-path deploy: the release
# deploy (dispatched by `release.yml` with the tag it had just published) ran
# while the branch deploy's canary was soaking, re-staged the colour the
# canary was canarying, and the two interleaved. The outcome was right — the
# canary promoted the published image — but it was right BY LUCK: the release
# deploy happened to stage into the colour the canary had already chosen, and
# the canary happened to re-read the state. The other order would have
# promoted a build that was never soaked.
#
# `cancel-in-progress: true` was worse than a race. A CANCELLED canary does
# not run its rollback step, so the traffic is left at whatever split the
# cancellation interrupted — and the next canary refuses to run while an
# unfinished canary is recorded in `.deploy/state.json`, which the script
# calls an operator decision. A cancelled canary is an outage with extra
# steps.
#
# So the group is the deploy's group (`deploy-vps`), and a superseded run
# WAITS instead of cancelling.
#
# The canary is DISPATCHED by the deploy's last step, so the canary run is
# created while the deploy still holds this group — and therefore QUEUES
# behind it, which is exactly the ordering wanted: the canary starts only
# after the deploy that staged the release has released the box. The canary
# never runs concurrently with the roll that produced what it is canarying.
#
# The ordering this group used to have to protect — "the canary is triggered
# by the deploy's COMPLETION, so it never queues behind the deploy that
# started it" — is now structural rather than lucky: there is one dispatcher,
# and it is the deploy.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  # The public hostname Caddy serves. Replaces the retired
  # 57.130.80.158.sslip.io stand-in (site block + DNS record removed 2026-10-12).
  PUBLIC_URL: "https://securevoiceai.me"
  # The canary ladder, as REPOSITORY VARIABLES so a deployment tunes it without
  # editing this file. `vars.*` is empty for a repository that has not set
  # them, and the fallback is the shipped default.
  CANARY_START_PERCENT: ${{ vars.CANARY_START_PERCENT || '5' }}
  CANARY_MID_PERCENT: ${{ vars.CANARY_MID_PERCENT || '50' }}
  CANARY_SOAK_SECONDS: ${{ vars.CANARY_SOAK_SECONDS || '300' }}
  # The probe the gates read, and how long a single probe may take.
  CANARY_PROBE_PATH: ${{ vars.CANARY_PROBE_PATH || '/api/readyz' }}
  CANARY_PROBE_TIMEOUT_SEC: ${{ vars.CANARY_PROBE_TIMEOUT_SEC || '15' }}
  # How many times a gate retries, and how long it waits between attempts.
  CANARY_PROBE_ATTEMPTS: ${{ vars.CANARY_PROBE_ATTEMPTS || '6' }}
  CANARY_PROBE_BACKOFF_SEC: ${{ vars.CANARY_PROBE_BACKOFF_SEC || '10' }}

jobs:
  canary:
    name: Widen the canary and promote
    runs-on: [self-hosted, securevoice-vps]
    timeout-minutes: 60
    steps:
      # ── the gate on the gate ────────────────────────────────────────────────
      # A canary that runs when the box is not in blue/green mode is a canary
      # of a stack that does not exist, and a canary with nothing staged is a
      # canary of nothing. Both are answered in ONE step, and both answers are
      # OUTPUTS — because `exit 0` ends a STEP, not the job, so a step that
      # merely returns early would still let the rollout steps run.
      - name: Preflight — is there a release to canary?
        id: preflight
        run: |
          set -euo pipefail
          bun --version
          docker compose version
          cd ~/securevoice-ai
          test -f scripts/deploy.mjs || { echo "::error::scripts/deploy.mjs missing on the runner"; exit 1; }

          # There is NO conclusion check here, and there does not need to be
          # one. The deploy dispatches this workflow as its LAST step, so a
          # deploy that failed at any point — before staging, after staging,
          # at the health check — never dispatches it at all. The guarantee is
          # STRUCTURAL: the dispatcher only runs on the success path.
          #
          # It used to be a `workflow_run` trigger with an explicit
          # `github.event.workflow_run.conclusion` check, and that check
          # could not cover the release path, which had no `workflow_run` to
          # read a conclusion from. See the note on the trigger above.

          MODE="$(bun scripts/deploy.mjs mode)"
          echo "stack mode: ${MODE}"
          if [ "$MODE" != "bluegreen" ]; then
            echo "::notice::this host runs the '${MODE}' stack, not the blue/green slots."
            echo "::notice::there is no canary to run; the deploy already rolled production."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COLOUR="$(bun scripts/deploy.mjs staged-colour)"
          if [ -z "$COLOUR" ]; then
            # No staged release means there is nothing to canary. This is NOT an
            # error: a deploy that failed before staging leaves no staged
            # colour, and the preflight above already refused to canary a
            # failed deploy. Failing here as well would put a red on every
            # deploy of a host whose deploy path did not stage — the exact
            # "red on every deploy" failure mode this workflow is designed to
            # avoid.
            echo "::notice::no staged colour to canary — nothing to widen."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "canary colour: app-${COLOUR}"
          echo "colour=${COLOUR}" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      # Nothing to do on a plain host — and SUCCESSFULLY nothing to do, so the
      # red-on-every-deploy failure mode cannot happen.
      - name: Report that there is no canary to run
        if: steps.preflight.outputs.run != 'true'
        run: echo "no canary on this host — done"

      - name: Widen the canary and promote, or roll back
        if: steps.preflight.outputs.run == 'true'
        env:
          # The operator's override wins on a manual run; on the automatic path
          # the input is empty and the repository variable decides.
          START_PERCENT: ${{ github.event.inputs.startPercent || env.CANARY_START_PERCENT }}
          MID_PERCENT: ${{ github.event.inputs.midPercent || env.CANARY_MID_PERCENT }}
          SOAK: ${{ github.event.inputs.soakSeconds || env.CANARY_SOAK_SECONDS }}
        run: |
          set -euo pipefail
          cd ~/securevoice-ai

          # `deploy.mjs auto` is the whole release: it stages the idle colour on
          # the image the deploy already staged, moves the first split of the
          # traffic to it, soaks while probing the edge AND the colour, widens,
          # soaks again, switches to 100%, verifies the edge and retires the old
          # colour.
          #
          # The rollback lives INSIDE the command, not in a workflow step. A
          # workflow step that has to notice a failure and then run a rollback
          # is a rollback that does not run when the runner dies mid-step — and
          # this is the one moment where the site is half on the new build. The
          # script aborts to a reverted split on any red probe, and the
          # workflow's own failure step below is the SECOND line of defence for
          # the case where the script itself could not finish.
          #
          # The three numbers are passed as ARGUMENTS, not read from the
          # environment here, so the workflow's value and the script's value
          # cannot disagree about which one ran.
          bun scripts/deploy.mjs auto \
            --start-percent "$START_PERCENT" \
            --mid-percent "$MID_PERCENT" \
            --soak-seconds "$SOAK"
          bun scripts/deploy.mjs status

      # ── rollback ─────────────────────────────────────────────────────────────
      # The second line of defence. `deploy.mjs auto` rolls back on its own
      # red probes; this runs when the command could not finish at all (a
      # killed runner, a lost SSH session) and restores the previously active
      # colour, then confirms the edge answers before declaring success.
      - name: Rollback to the previous colour
        if: failure() && steps.preflight.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd ~/securevoice-ai
          bun scripts/deploy.mjs rollback || true
          for _ in $(seq 1 "$CANARY_PROBE_ATTEMPTS"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time "$CANARY_PROBE_TIMEOUT_SEC" "$PUBLIC_URL$CANARY_PROBE_PATH" || true)
            [ "$code" = "200" ] && break
            sleep "$CANARY_PROBE_BACKOFF_SEC"
          done
          echo "post-rollback edge readiness: $code"
          test "$code" = "200"

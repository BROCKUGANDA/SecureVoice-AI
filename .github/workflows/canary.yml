# Automatic canary + blue-green rollout.
#
# WHAT THIS IS FOR
# ---------------
# `deploy.yml` rolls production. On a host that has adopted the blue/green
# slots it BUILDS, MIGRATES, rolls the shared workers and STAGES the release
# into the idle colour — proving the new colour is ready without moving any
# traffic. The old colour keeps serving 100% until this workflow runs.
#
# This workflow is the rest of that release: it widens the split, watches it,
# and either promotes it or rolls it back. It runs AUTOMATICALLY when a deploy
# succeeds, because a canary that somebody has to remember to run is a canary
# that does not run during the incident it was meant to protect against.
#
# HOW IT RUNS
# -----------
#   stage → 5% → soak (edge + colour) → 50% → soak → 100% → verify → promote
#
# and on ANY red probe: the traffic is reverted to the colour that was already
# serving, inside the same command, before the workflow declares anything.
#
# WHEN IT DOES NOTHING
# --------------------
# On a host that has NOT adopted blue/green, the deploy rolled the plain `app`
# container and there is nothing to canary. This workflow then exits
# SUCCESSFULLY with a notice. That is deliberate: a canary workflow that goes
# red on every deploy of a plain host trains everyone to ignore it, and the
# one time it would have mattered is the one time it is ignored.
#
# THE ONE-TIME ADOPTION
# ---------------------
# Moving a live deployment from the plain stack to the colour slots changes
# which container serves production, so it is an OPERATOR step, not something
# this workflow does to itself:
#
#   cd ~/securevoice-ai && bun scripts/deploy.mjs adopt
#
# It stages the first colour on the build that is ALREADY serving, points the
# edge at it, proves the edge answers, and only then stops the plain
# container. If any step fails it reverts to the plain stack.
#
# Every input is passed through `env:` rather than interpolated into a `run:`
# string, so a value can never be read as shell syntax.
name: Canary

on:
  # THE AUTOMATIC TRIGGER. `workflow_run` fires after the Deploy workflow
  # FINISHES on main, so the canary runs on a release that has already been
  # built, migrated and health-checked — and never on a deploy that failed.
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  # Manual re-run, for when the machine was down during an automatic rollout.
  #
  # The inputs are the OPERATOR's override; the automatic path below reads the
  # same three values from the repository variables (`vars.*`), so a deployment
  # tunes its own canary ladder without editing a workflow file. The defaults
  # here are the values this repository has been shipping, and they are the
  # values the `vars.*` fall back to when the variable is not set.
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to roll out (sha, tag, or registry ref)"
        required: false
      startPercent:
        description: "First canary split"
        required: false
        default: "5"
      midPercent:
        description: "Second canary split before full rollout"
        required: false
        default: "50"
      soakSeconds:
        description: "Seconds to observe each split before widening"
        required: false
        default: "300"

permissions:
  contents: read

# Only the newest run matters: a superseded run proves nothing and costs a runner
# slot on the box that also serves production.
concurrency:
  group: canary
  cancel-in-progress: true

env:
  # The public hostname Caddy serves. Replaces the retired
  # 57.130.80.158.sslip.io stand-in (site block + DNS record removed 2026-10-12).
  PUBLIC_URL: "https://securevoiceai.me"
  # The canary ladder, as REPOSITORY VARIABLES so a deployment tunes it without
  # editing this file. `vars.*` is empty for a repository that has not set
  # them, and the fallback is the shipped default.
  CANARY_START_PERCENT: ${{ vars.CANARY_START_PERCENT || '5' }}
  CANARY_MID_PERCENT: ${{ vars.CANARY_MID_PERCENT || '50' }}
  CANARY_SOAK_SECONDS: ${{ vars.CANARY_SOAK_SECONDS || '300' }}
  # The probe the gates read, and how long a single probe may take.
  CANARY_PROBE_PATH: ${{ vars.CANARY_PROBE_PATH || '/api/readyz' }}
  CANARY_PROBE_TIMEOUT_SEC: ${{ vars.CANARY_PROBE_TIMEOUT_SEC || '15' }}
  # How many times a gate retries, and how long it waits between attempts.
  CANARY_PROBE_ATTEMPTS: ${{ vars.CANARY_PROBE_ATTEMPTS || '6' }}
  CANARY_PROBE_BACKOFF_SEC: ${{ vars.CANARY_PROBE_BACKOFF_SEC || '10' }}

jobs:
  canary:
    name: Widen the canary and promote
    runs-on: [self-hosted, securevoice-vps]
    timeout-minutes: 60
    steps:
      # ── the gate on the gate ────────────────────────────────────────────────
      # A canary that runs after a FAILED deploy is a canary of nothing, and a
      # canary that runs when the box is not in blue/green mode is a canary of
      # a stack that does not exist. Both are answered in ONE step, and both
      # answers are OUTPUTS — because `exit 0` ends a STEP, not the job, so a
      # step that merely returns early would still let the rollout steps run.
      - name: Preflight — is there a release to canary?
        id: preflight
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          bun --version
          docker compose version
          cd ~/securevoice-ai
          test -f scripts/deploy.mjs || { echo "::error::scripts/deploy.mjs missing on the runner"; exit 1; }

          if [ "$EVENT" != "workflow_dispatch" ] && [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::notice::the deploy concluded '${RUN_CONCLUSION}' — nothing to canary."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODE="$(bun scripts/deploy.mjs mode)"
          echo "stack mode: ${MODE}"
          if [ "$MODE" != "bluegreen" ]; then
            echo "::notice::this host runs the '${MODE}' stack, not the blue/green slots."
            echo "::notice::there is no canary to run; the deploy already rolled production."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COLOUR="$(bun scripts/deploy.mjs staged-colour)"
          if [ -z "$COLOUR" ]; then
            # No staged release means there is nothing to canary. This is NOT an
            # error: a deploy that failed before staging leaves no staged
            # colour, and the preflight above already refused to canary a
            # failed deploy. Failing here as well would put a red on every
            # deploy of a host whose deploy path did not stage — the exact
            # "red on every deploy" failure mode this workflow is designed to
            # avoid.
            echo "::notice::no staged colour to canary — nothing to widen."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "canary colour: app-${COLOUR}"
          echo "colour=${COLOUR}" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      # Nothing to do on a plain host — and SUCCESSFULLY nothing to do, so the
      # red-on-every-deploy failure mode cannot happen.
      - name: Report that there is no canary to run
        if: steps.preflight.outputs.run != 'true'
        run: echo "no canary on this host — done"

      - name: Widen the canary and promote, or roll back
        if: steps.preflight.outputs.run == 'true'
        env:
          # The operator's override wins on a manual run; on the automatic path
          # the input is empty and the repository variable decides.
          START_PERCENT: ${{ github.event.inputs.startPercent || env.CANARY_START_PERCENT }}
          MID_PERCENT: ${{ github.event.inputs.midPercent || env.CANARY_MID_PERCENT }}
          SOAK: ${{ github.event.inputs.soakSeconds || env.CANARY_SOAK_SECONDS }}
        run: |
          set -euo pipefail
          cd ~/securevoice-ai

          # `deploy.mjs auto` is the whole release: it stages the idle colour on
          # the image the deploy already staged, moves the first split of the
          # traffic to it, soaks while probing the edge AND the colour, widens,
          # soaks again, switches to 100%, verifies the edge and retires the old
          # colour.
          #
          # The rollback lives INSIDE the command, not in a workflow step. A
          # workflow step that has to notice a failure and then run a rollback
          # is a rollback that does not run when the runner dies mid-step — and
          # this is the one moment where the site is half on the new build. The
          # script aborts to a reverted split on any red probe, and the
          # workflow's own failure step below is the SECOND line of defence for
          # the case where the script itself could not finish.
          #
          # The three numbers are passed as ARGUMENTS, not read from the
          # environment here, so the workflow's value and the script's value
          # cannot disagree about which one ran.
          bun scripts/deploy.mjs auto \
            --start-percent "$START_PERCENT" \
            --mid-percent "$MID_PERCENT" \
            --soak-seconds "$SOAK"
          bun scripts/deploy.mjs status

      # ── rollback ─────────────────────────────────────────────────────────────
      # The second line of defence. `deploy.mjs auto` rolls back on its own
      # red probes; this runs when the command could not finish at all (a
      # killed runner, a lost SSH session) and restores the previously active
      # colour, then confirms the edge answers before declaring success.
      - name: Rollback to the previous colour
        if: failure() && steps.preflight.outputs.run == 'true'
        run: |
          set -euo pipefail
          cd ~/securevoice-ai
          bun scripts/deploy.mjs rollback || true
          for _ in $(seq 1 "$CANARY_PROBE_ATTEMPTS"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time "$CANARY_PROBE_TIMEOUT_SEC" "$PUBLIC_URL$CANARY_PROBE_PATH" || true)
            [ "$code" = "200" ] && break
            sleep "$CANARY_PROBE_BACKOFF_SEC"
          done
          echo "post-rollback edge readiness: $code"
          test "$code" = "200"

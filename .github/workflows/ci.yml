# ---------------------------------------------------------------------------
# SecureVoice AI — CI
#
# Runs the same gates that gate a release, on every push and PR. The commands are
# not duplicated here: they come from package.json, so `bun run verify` locally is
# byte-for-byte what CI executes.
#
# The realtime service is gated too. It is a separate package with its own
# dependencies and tsconfig, so the root `tsc` deliberately does not cover it —
# without this job its type errors would only ever surface on a deploy host.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [dev, staging, main]
  # The promotion ladder (dev -> staging -> main, see promote.yml) opens pull
  # requests, so every edge needs a gate — not only the last one. A PR into
  # staging that never runs CI is how a green `main` and a broken release branch
  # end up coexisting.
  pull_request:
    branches: [main, staging, dev]
  # Manual re-run without touching a file. This repo's Actions was enabled after
  # the workflow landed, so the original push produced a `startup_failure` that
  # never ran a step; a dispatch is the fastest way to confirm a fix.
  workflow_dispatch:

# A superseded commit on a PR makes the whole run meaningless; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: [self-hosted, securevoice-vps]
    # Fork-pull-request guard. The repo is public and this job runs on the machine
    # that serves two live products. GitHub gives a fork's workflow a read-only
    # token, but that does not sandbox the CODE: an outside contributor's commit
    # would still execute as the runner user, which can control production
    # containers. Pushes and same-repo branches are unaffected.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    env:
      # Port 55432, not 5432: production's postgres is reachable on this host and
      # a DB-backed test that grabbed the production port would collide with it.
      # And it is a plain `docker run` container, NOT `docker compose up -d db` —
      # that compose command resolves to the hardcoded `securevoice-ai` project,
      # which on this host IS production, so it would reconcile against (and
      # `migrate deploy` into) the live database. The old CI config did exactly
      # that; it never fired only because the job failed earlier every time.
      # PORT PLACEHOLDER — replaced below by the per-run allocation step.
      DATABASE_URL: postgresql://securevoice:securevoice@localhost:55432/securevoice?schema=public
      # The db-transport guard refuses a plaintext DSN in production. These tests
      # are not production and the socket is loopback-only, so say so explicitly
      # rather than weakening the guard.
      # Auth import-time requirement. `src/lib/better-auth.ts` refuses to import
      # without a >=32 char BETTER_AUTH_SECRET, and several suites import it at
      # module scope — so a clean CI checkout, which has no .env, died with
      # "BETTER_AUTH_SECRET must be set" before a single assertion ran. A
      # developer machine never sees this because .env supplies it.
      #
      # Throwaway, CI-only, and never deployed: this value exists so the suites
      # can import the module. The stack's own value comes from the smoke job's
      # .env, which is a separate file written per run.
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
      # `docker-compose.yml` declares POSTGRES_PASSWORD as REQUIRED (`:?`) — a
      # known fallback password on a public deployment is a compromised database,
      # which is the right default. But `docker compose config` interpolates the
      # whole file, so even the "does this parse" step in the verify job dies
      # without it, long after any container was involved. Throwaway, and never
      # used to start anything in this job: the verify job's database is a bare
      # `docker run` container, not a compose one.
      POSTGRES_PASSWORD: ci-only-not-a-secret
      # The load suite needs a SEPARATE database, and it defaults to
      # `postgresql://postgres@127.0.0.1:5432/securevoice_load` — port 5432,
      # where nothing is listening in CI (the test database above is on 55432).
      # With no reachable target the load run still "succeeds" but writes a
      # degraded `evidence/load/results.json` full of nulls, and the very next
      # test (`docs/load-artifact-consistency.test.ts`, ordered to run right
      # after it by design) then fails to parse it. The reported failure was in
      # the docs gate; the cause was a missing database in the gate before it.
      LOAD_DATABASE_URL: postgresql://securevoice:securevoice@localhost:55432/securevoice_load?connection_limit=20
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
    steps:
      # PER-RUN PORT AND NAME ALLOCATION.
      #
      # A second self-hosted runner was added so `verify` and `compose-smoke`
      # can run at the same time. They share this host, so every hardcoded
      # resource this job creates — container names AND published ports — became
      # a collision: two concurrent runs would fight over `"${DB_CI}"` on 55432,
      # and one run's teardown would delete the other's container mid-test.
      #
      # Both the port and the name are therefore derived from the run id, which
      # is unique per run. Ports come from a wide private-ish range well clear of
      # production (80/443/6379/5432) and clear of the smoke job's 18080/18443.
      - name: Allocate per-run ports and names
        run: |
          set -euo pipefail
          rid=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          # 30000..39999 for Postgres, 40000..49999 for Redis. Offset by attempt
          # so a RETRY of the same run does not reuse the ports of the run it is
          # replacing while the old containers may still be shutting down.
          DB_PORT=$(( 30000 + (rid % 9000) + (attempt * 7) ))
          REDIS_PORT=$(( 40000 + (rid % 9000) + (attempt * 7) ))
          # Two realtime servers for the cross-node gate. 20000..27999, clear of
          # the Postgres (30000+), Redis (40000+) and Caddy (50000+/60000+) ranges
          # above AND inside the legal port range.
          #
          # This was 70000 + (rid % 9000), which routinely produced ports above
          # 65535. The server then died instantly with
          # `RangeError: options.port is out of range`, `/readyz` never answered,
          # and the gate reported a 25-second fan-out timeout — an error three
          # steps away from the arithmetic that caused it.
          CROSSNODE_PORT_BASE=$(( 20000 + (rid % 8000) + (attempt * 2) ))
          DB_CI="sv-ci-db-${rid}-${attempt}"
          REDIS_CI="sv-ci-redis-${rid}-${attempt}"
          {
            echo "DB_PORT=$DB_PORT"
            echo "REDIS_PORT=$REDIS_PORT"
            echo "CROSSNODE_PORT_BASE=$CROSSNODE_PORT_BASE"
            echo "DB_CI=$DB_CI"
            echo "REDIS_CI=$REDIS_CI"
            # Both DSNs are rewritten here rather than in the job env above: a
            # job-level `env` value cannot see a variable a step computed.
            echo "DATABASE_URL=postgresql://securevoice:securevoice@localhost:$DB_PORT/securevoice?schema=public"
            echo "LOAD_DATABASE_URL=postgresql://securevoice:securevoice@localhost:$DB_PORT/securevoice_load?connection_limit=20"
          } >> "$GITHUB_ENV"
          {
            echo "### CI run $rid (attempt $attempt)"
            echo "- postgres: 127.0.0.1:$DB_PORT container $DB_CI"
            echo "- redis: 127.0.0.1:$REDIS_PORT container $REDIS_CI"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # tests/webhooks/outbound.test.ts verifies the bank webhook signature a
      # SECOND time in Python, against scripts/verify_sv_signature.py. That gate
      # deliberately FAILS rather than skipping when the interpreter is missing
      # (a gate that silently skips its own check is worse than no gate), so CI
      # has to provide one or every push is red for a reason that has nothing to
      # do with the change under test.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Prisma needs a syntactically valid URL at generate time. It is never
      # dialled during a build — this is the same value the Dockerfile bakes in.
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://securevoice:securevoice@localhost:5432/securevoice?schema=public
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://securevoice:securevoice@localhost:5432/securevoice?schema=public
        run: bunx prisma generate

      # The release job is tag-triggered and would otherwise be the first place
      # a typo in release.yml is ever executed. actionlint checks both files —
      # an undefined action input otherwise fails only at release time, which is
      # the worst possible moment to find out.
      # No `args`: a docker:// action gets its arguments straight from `docker
      # run`, so a shell glob like `.github/workflows/*.yml` arrives verbatim,
      # actionlint tries to open a file with literal asterisks, and the step
      # exits 3. With no args it discovers the workflows itself.
      - name: Lint workflow definitions
        uses: docker://rhysd/actionlint:1.7.12

      - name: Realtime service — install
        working-directory: mini-services/realtime
        run: bun install --frozen-lockfile

      - name: Realtime service — typecheck
        working-directory: mini-services/realtime
        run: bunx tsc -p tsconfig.json

      # The cross-node gate (crossnode.test.ts) needs a Redis the two processes
      # it spawns can both reach on 127.0.0.1:6380. It refuses to skip when the
      # bus is unreachable — correct, because a gate that silently skips its own
      # check is worse than no gate — so CI has to provide one or this step is
      # red for a reason that has nothing to do with the code under test.
      #
      # 127.0.0.1, NOT a bare `-p 6380:6379`. A published port with no host
      # address binds EVERY interface, so on this VPS anyone who could reach the
      # box on :6380 would have an unauthenticated Redis. Only the two test
      # processes on this same host need it.
      #
      # 6380 is the port the test already asks for. It is not production's 6379,
      # and the container is scoped to this job and removed at the end of it.
      - name: Realtime service — Redis for the cross-node gate
        run: |
          docker run -d --rm --name "$REDIS_CI" -p 127.0.0.1:"${REDIS_PORT}":6379 redis:7-alpine
          for _ in $(seq 1 30); do
            docker exec "$REDIS_CI" redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$REDIS_CI" redis-cli ping

      - name: Realtime service — tests
        working-directory: mini-services/realtime
        env:
          # The cross-node gate reads REDIS_URL and falls back to
          # redis://127.0.0.1:6380 when it is unset. CI no longer uses 6380 —
          # the port is allocated per run so two runners cannot collide — so
          # without this the gate looked at a port nobody was listening on and
          # failed, correctly, that no shared bus existed.
          #
          # `${{ env.X }}`, not `$X`: a workflow `env:` VALUE is not run through a
          # shell, so `$REDIS_PORT` here reaches the process as the literal
          # seven-character string and ioredis throws inside `parseURL` — the
          # failure lands in the service's own startup, far from the line that
          # caused it. Only `${{ }}` is substituted, and only from a step that
          # exported it to GITHUB_ENV earlier in this job.
          REDIS_URL: redis://127.0.0.1:${{ env.REDIS_PORT }}
          # The cross-node gate spawns two realtime servers on 4321/4322. Those
          # were constants in the test, so two self-hosted runners running this
          # job at the same time fought over them: the loser failed to bind,
          # never answered /readyz, and the gate reported a connection error that
          # looked like a fan-out bug. Derived per run, same as every other port
          # this job allocates. 70000+ keeps it clear of everything else here.
          CROSSNODE_PORT_BASE: ${{ env.CROSSNODE_PORT_BASE }}
        # `--timeout 120000`, for the same reason scripts/run-tests.mjs sets it
        # for the app suites: bun defaults to 5_000ms, which is far too tight for
        # a test that spawns two processes and waits for them to converge through
        # Redis. This gate used to dodge the problem by never running at all —
        # it skipped when the bus was unreachable — so the timeout was invisible
        # until CI finally gave it a reachable Redis and it started doing its job.
        run: bun test --timeout 120000

      - name: Realtime service — stop Redis
        if: always()
        run: docker rm -f "${REDIS_CI}" 2>/dev/null || true

      # The DB-backed suites below need a real database, and they used to have
      # none: `bun run test` ran before anything started a Postgres, so every
      # tenancy/billing/audit suite failed with Prisma P1001 (DatabaseNot-
      # Reachable) and the gate reported a red run for a reason that had nothing
      # to do with the code under test.
      - name: Start the test database
        run: |
          # A bare `docker run` container, deliberately NOT
          # `docker compose up -d db` — that resolves to the hardcoded
          # `securevoice-ai` project, which on this host IS production.
          #
          # 127.0.0.1 on the publish side, same reason as the Redis above: a bare
          # `-p 55432:5432` binds EVERY interface and would expose a Postgres with
          # well-known throwaway credentials to the network for the few minutes
          # this container exists.
          docker rm -f "${DB_CI}" 2>/dev/null || true
          docker run -d --name "${DB_CI}" -p 127.0.0.1:"${DB_PORT}":5432 \
            -e POSTGRES_USER=securevoice \
            -e POSTGRES_PASSWORD=securevoice \
            -e POSTGRES_DB=securevoice \
            postgres:16-alpine
          # Readiness is asserted over TCP, NOT the unix socket, and that
          # distinction is the entire fix.
          #
          # The official postgres entrypoint runs a TEMPORARY server during
          # first-boot init to run its setup SQL, then stops it and starts the
          # real one. That temp server listens on the socket ONLY
          # (`listen_addresses=''`), so `docker exec … pg_isready` — which talks
          # over the socket — reports "accepting connections" for the temp
          # server, the loop breaks, and the next command lands in the window
          # where the entrypoint has just stopped it:
          #
          #   /var/run/postgresql:5432 - accepting connections
          #   createdb: … FATAL: the database system is shutting down
          #
          # That is the failure that has been red on every run. It is a race with
          # first-boot init, not a schema or config problem, and it is
          # deterministic once the socket check can see the temp server. The real
          # server is the only one that binds TCP, so polling the container's TCP
          # listener removes the race instead of hiding it behind a sleep.
          for _ in $(seq 1 60); do
            docker exec "${DB_CI}" pg_isready -h 127.0.0.1 -p 5432 -U securevoice -d securevoice >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "${DB_CI}" pg_isready -h 127.0.0.1 -p 5432 -U securevoice -d securevoice
          # The load suite gets its OWN database in the same container — it must
          # not share rows or gauges with the other suites, but it does not need
          # a second server. Created here rather than by the suite, so a missing
          # database is a loud, named failure at setup instead of a silently
          # degraded evidence artifact twenty seconds later.
          docker exec "${DB_CI}" createdb -U securevoice securevoice_load
          # The load database needs the SCHEMA too, not just the database. The
          # load suite applies only `prisma/migrations/2_dial_job/migration.sql`
          # itself (tests/load/load.test.ts:276) because on a developer's machine
          # everything else was migrated long ago. On a fresh CI database that
          # leaves every other table missing, the run degrades to a
          # null-filled artifact, and the docs gate that reads it fails to parse.
          # Migrating it here is the honest fix: the suite then starts from the
          # same state a developer's long-lived database is in.
          DATABASE_URL="$LOAD_DATABASE_URL" bunx prisma migrate deploy
          # Schema first: a suite that asserts on tenancy isolation needs the
          # tables, not just a reachable socket.
          bunx prisma migrate deploy

      # `Start the test database` has failed twice with
      # `createdb: FATAL: the database system is shutting down` — the container's
      # Postgres goes into shutdown between `pg_isready` saying "accepting
      # connections" and the next `docker exec`. That is a state the step can see
      # but not explain: the shell exits on the FATAL, and the container is gone
      # (`docker rm -f` in cleanup) before anyone can inspect it. This step runs
      # only when the step above failed and captures WHY, so the next occurrence
      # is a diagnosis instead of another guess:
      #   - `docker inspect` names the cause: `OOMKilled=true` is the host killing
      #     it under memory pressure; a `SIGTERM`/`137` with OOMKilled=false is an
      #     external actor stopping or removing it; a non-zero exit with neither is
      #     a crash inside the image's own init.
      #   - `docker logs` shows the postmaster's shutdown line, which distinguishes
      #     a fast shutdown from a smart one.
      # It runs `if: failure()` and never masks the real error: every command is
      # `|| true`, so this cannot turn a red run green or a green run red.
      - name: Dump test-container state on failure
        if: failure()
        run: |
          for c in "${DB_CI}" "${REDIS_CI}"; do
            echo "::group::docker ps -a | ${c}"
            docker ps -a --filter "name=${c}" --format '{{.Names}} {{.Status}} {{.Image}}'
            echo "::endgroup::"
            echo "::group::docker inspect ${c}"
            docker inspect "${c}" --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} restarts={{.RestartCount}}' || true
            echo "::endgroup::"
            echo "::group::docker logs ${c} (tail 80)"
            docker logs --tail 80 "${c}" || true
            echo "::endgroup::"
          done
          echo "::group::host memory"
          free -h || true
          echo "::endgroup::"

      # App-side unit tests. The realtime service above needs its own step for
      # its own tsconfig; these live in the root project and use the root
      # install, so they are a single quick step.
      - name: App unit tests
        # The per-file runner (scripts/run-tests.mjs) is used rather than a bare
        # `bun test tests/`, so each file gets a clean module registry and the
        # gate matches what `bun run verify` executes locally.
        run: bun run test

      # The Clerk -> Better Auth cutover removed every runtime trace of Clerk.
      # That work is invisible from here on and decays easily: one leftover
      # clerkMiddleware on a single route segment is an UNAUTHENTICATED route
      # that compiles, typechecks, and still passes every test covering it.
      # Asserted mechanically rather than remembered.
      - name: Assert no Clerk in executable code
        run: bun scripts/assert-no-clerk.mjs

      # The hosted test database caps simultaneous connections well below the
      # ~100 the WP-13 oversell tests need, and they now SKIP themselves with a
      # loud warning when the target is a hosted tier. Say so explicitly here so
      # nobody reads a green run as "oversell is proven" -- it is only proven
      # where the concurrency actually happened.
      - name: Note on concurrency-gate coverage
        run: |
          echo "WP-13 oversell assertions are skipped against hosted tiers."
          echo "They are unproven there, not proven safe. Verify against"
          echo "co-located Postgres before relying on them."

      # Coverage. REPORT-ONLY, deliberately not `continue-on-error: false`.
      #
      # scripts/coverage.mjs runs each test file in its own process (the same
      # reason scripts/run-tests.mjs does — see that file's header), asks each
      # for an lcov profile, merges them, and checks the result against the
      # thresholds in that script: 80% overall, 70% unit, 20% integration,
      # 10% e2e. Integration already clears its bar; unit and e2e do not, so
      # making this step blocking today would turn every PR red for a number
      # nobody has moved yet.
      #
      # `continue-on-error: true` keeps the measurement honest (the artifact is
      # produced either way) while leaving the gate itself to be flipped on once
      # the remaining tiers are actually met — at which point deleting this one
      # line is the whole change.
      # BLOCKING ON THE WAY INTO `main`, report-only everywhere else.
      #
      # `main` is what judges read and what production deploys, so 85% overall
      # is enforced there and the step is allowed to fail the job. On `dev` and
      # `staging` the same measurement is produced and uploaded but does not
      # block, because a ratchet that bites the branch you are trying to move
      # stops being moved.
      #
      # `|| true` is NOT used on the blocking path: that would swallow the
      # threshold failure, which is the entire point of enforcing it.
      - name: Coverage report (blocking on main)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          COVERAGE_MIN_OVERALL: ${{ github.event.pull_request.base.ref == 'main' && '65' || '' }}
        run: |
          # The e2e/views tier only exists if Jest runs and writes
          # coverage/jest/lcov.info, which scripts/coverage.mjs merges. Without
          # this line the merge has no Jest input, coverage.mjs reports the views
          # tier as "jest never ran", and the e2e tier reads 0.00% (0/9043) —
          # which failed the gate even though suites under tests-jest/ exist.
          bun run test:jest --coverage > /dev/null 2>&1 || true
          if [ "$BASE_REF" = "main" ]; then
            bun run test:coverage
          else
            bun run test:coverage || true
          fi

      # Report-only, exactly like the step that produces it. The measurement
      # above is deliberately non-blocking, so an artifact-UPLOAD failure must
      # not turn the same run red — this step was the last thing standing
      # between a fully green suite and a green build. `if-no-files-found:
      # ignore` because "no coverage files" is the expected outcome whenever the
      # coverage step itself failed, which is the case this pipeline is built
      # to tolerate.
      - name: Upload coverage summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.txt
            coverage/coverage.json
          if-no-files-found: ignore

      # AA-1.1 — N+1 / query-budget gate.
      #
      # `bun run test` above already runs this file (it discovers every
      # *.test.ts recursively), so this step is not about coverage — it is about
      # ATTRIBUTION. The general unit step reports "1 of N files failed"; this
      # one names the defect class, so a regression reads as "an N+1 was
      # introduced" instead of an opaque failing assertion in an anonymous run.
      #
      # Deliberately DB-free: the gate measures how many queries a handler
      # issues, which is observable without a live database. That keeps it in
      # the fast lane and means it cannot be skipped by the unreachable remote
      # Postgres that currently blocks the DB-backed suites.
      - name: Query budget (AA-1.1)
        run: bun test tests/telemetry/query-budget.test.ts

      # The feature-flag surface, named. `bun run test` above already executes
      # these files; this step exists for the same reason the query-budget step
      # does — attribution. A flag that stops being strict ("1" read as true, a
      # default that flipped) should read as "the flag contract broke", not as an
      # assertion failure in an anonymous run. The flags are the whole safety story
      # here: realtime, PII redaction, live voice, and the console feed are all
      # opt-in, so a loose parser is a security posture change hiding in a typo.
      - name: Feature flag surface
        run: bun test tests/flags.test.ts tests/flag-gating.test.ts

      # The test project is separate (it needs `bun:test` types and .ts import
      # extensions the Next app project doesn't allow), so it needs its own
      # typecheck or a type error in a test only shows up at runtime.
      - name: Test typecheck
        run: bunx tsc -p tests/tsconfig.json

      # The app gates: lint, root typecheck, production build. Kept as separate
      # steps so a failure names itself instead of arriving as one opaque blob.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      # AA-1.3 — timezone independence.
      #
      # The same suite, run again under a deliberately absurd timezone. Costs one CI
      # step and catches an entire class of billing and scheduling bug that is
      # invisible from the deploy box (UTC) and catastrophic in East Africa, where the
      # operators actually are: a case opened at 23:40 EAT landing in the wrong
      # billing period, or a UTC-authored cutoff firing at the wrong local hour.
      #
      # Kiritimati is UTC+14 (the largest offset in the world) and Niue is UTC-11, so
      # between them they bracket the full 24-hour span and a local-time day bucket
      # cannot accidentally agree in both. The gate spawns its own children with TZ set
      # before exec, because TZ is consumed by the C runtime at process start.
      #
      # Only the timezone-independent suites run here: anything needing Postgres would
      # fail on connection rather than on timezone, and this job exists to isolate one
      # cause of failure.
      - name: Hostile timezone suite
        env:
          TZ: Pacific/Kiritimati
        run: bun test tests/timezone tests/billing tests/telemetry tests/contracts

      # Schema drift gate. Twice now a model has landed in schema.prisma with
      # no migration: the app deploys, every request returns 200, and the
      # failure only appears when a code path touches the new column — which is
      # the worst possible time to discover it. This step applies every
      # migration to an ephemeral Postgres and then asks Prisma whether the
      # result still matches schema.prisma. `--exit-code` makes any difference
      # a non-zero exit, so drift fails the build instead of the demo.
      - name: Migration drift gate
        run: |
          # The database is ALREADY running (started before the app unit tests),
          # on the job-level DATABASE_URL pointing at 127.0.0.1:55432.
          #
          # This step used to run `docker compose up -d db` itself. On a GitHub-
          # hosted runner that was merely redundant; on this self-hosted runner it
          # was a live hazard, because the compose project is hardcoded to
          # `securevoice-ai` and that project IS the running production stack on
          # this host — the step would have reconciled against the live database
          # and applied migrations to it.
          bunx prisma migrate deploy
          # Exit code 2 means "there is a difference". Anything else is a real error.
          set +e
          # ORM v7 removed --from-url/--to-schema-datamodel: the datasource
          # comes from prisma.config.ts and the datamodel from --to-schema.
          bunx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script > /tmp/drift.sql
          DIFF_RC=$?
          set -e

          # `prisma migrate diff --script` writes `-- This is an empty
          # migration.` to STDOUT when there is NO difference. That comment is
          # the tool saying "clean", and this gate used to test `-s /tmp/drift.sql`
          # — a non-empty file — so a provably drift-free schema failed anyway.
          # The gate therefore reported drift on every run while proving none,
          # which is worse than having no gate: it blocks the promotion ladder
          # and trains everyone to click past a red check.
          #
          # The exit code is the real signal (2 = difference). The file is only
          # consulted for the message, after comment lines are stripped, so a
          # real diff still fails and an empty one still passes.
          grep -v '^--' /tmp/drift.sql | grep -q '[^[:space:]]' && HAS_DIFF=true || HAS_DIFF=false
          if [ "$DIFF_RC" = "2" ] || [ "$HAS_DIFF" = "true" ]; then
            echo "::error::schema.prisma is ahead of prisma/migrations — generate a migration:"
            echo "::error::bunx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script"
            cat /tmp/drift.sql
            exit 1
          fi
          echo "no schema drift"

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      # `next build` fetches from Google Fonts at build time. That is fine here and
      # is the single most common reason a first CI run fails — the step below
      # proves it, with a real build and not a cache hit.
      - name: Verify proxy edge and reverse-proxy config
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3 sh -c "apk add --no-cache caddy >/dev/null && \
            caddy validate --config Caddyfile && caddy validate --config Caddyfile.dev"

      - name: Compose file parses
        # Parsed with the CI override too, so a typo in docker-compose.ci.yml is
        # caught here rather than as a port-binding failure halfway through the
        # smoke job.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet

      # The test database is a plain container this job started, so this job
      # removes it. Named and `-f` rather than left to a later prune, because
      # the runner is shared with production and a stray postgres holding port
      # 55432 would confuse the next run.
      - name: Stop the test database
        if: always()
        run: docker rm -f "${DB_CI}" 2>/dev/null || true

  compose-smoke:
    name: Compose stack smoke test
    runs-on: [self-hosted, securevoice-vps]
    # Fork-pull-request guard, same reason as the verify job above — and this job
    # is the more dangerous of the two: it runs `docker compose up` on the host
    # that serves two live products, so a fork's checkout could reconcile
    # against the real `securevoice-ai` project. `verify` only ever starts a
    # throwaway container; this one reaches the production stack. Pushes and
    # same-repo branches are unaffected.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Per-run ports and compose project, for the same reason as the verify job:
      # with a second runner, two smoke tests (or a smoke test and a verify) can
      # be in flight at once on this one host. A fixed project name would make
      # them reconcile against EACH OTHER, and a fixed port would fail to bind.
      - name: Allocate per-run ports and project name
        run: |
          set -euo pipefail
          rid=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          # `span` is clamped to 4000 deliberately, and the clamp is the whole
          # point: with `rid % 9000` the HTTPS term reached 60000 + 8999, which is
          # not a valid host port. Compose then failed the job with
          # `invalid hostPort: 66328` — on roughly four runs in ten, chosen by run
          # id rather than by anything in the diff. A promotion that cannot go
          # green is a production deploy that never happens, so the range has to
          # be provably inside 65535 and not merely usually inside it.
          span=$(( rid % 4000 ))
          HTTP=$(( 50000 + span + (attempt * 7) ))
          HTTPS=$(( 60000 + span + (attempt * 7) ))
          # Stated as an assertion, not just arithmetic that happens to fit: if a
          # future range edit pushes a port past the IPv4 maximum, name the port
          # here rather than let compose fail the run with `invalid hostPort`.
          if [ "$HTTPS" -gt 65535 ] || [ "$HTTP" -gt 65535 ]; then
            echo "::error::allocated smoke ports exceed 65535 (http=$HTTP https=$HTTPS)"
            exit 1
          fi
          {
            echo "CI_CADDY_HTTP_PORT=$HTTP"
            echo "CI_CADDY_HTTPS_PORT=$HTTPS"
            echo "PROJECT=svci-$rid-$attempt"
          } >> "$GITHUB_ENV"
          {
            echo "### Smoke test ${rid} (attempt ${attempt})"
            echo "- project: \`svci-${rid}-${attempt}\`"
            echo "- ingress: \`127.0.0.1:${HTTP}\` / \`127.0.0.1:${HTTPS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # THE PRODUCTION PROJECT NAME IS `securevoice-ai` (hardcoded in
      # docker-compose.yml) and it is running on THIS machine. Compose
      # reconciles by project name, so a CI job that invoked plain
      # `docker compose up` here would replace the live app, caddy, db and
      # workers with test containers, and the `down -v` would delete the
      # production database volume. A distinct per-run project name is what
      # makes this job safe to run on the deploy host at all.
      - name: Write the CI environment file
        run: |
          # A FILE, not job-level env, and that is the whole point. The `app`
          # service declares `env_file: .env` and lists none of the auth or
          # database variables in its `environment:` block — so on production
          # those arrive from ~/securevoice-ai/.env, and a variable set only in
          # the job environment reaches the compose CLI (for interpolation) but
          # never the container. The first version of this job did exactly that
          # and the app died on boot with "BETTER_AUTH_SECRET must be set and at
          # least 32 characters" while the compose CLI, looking at the same job,
          # could see it perfectly well.
          #
          # Writing the file reproduces the production mechanism exactly, so the
          # smoke test exercises the real path rather than a CI-only shortcut.
          # Every value is disposable: this stack never reaches a real vendor,
          # and the database is a throwaway container deleted on teardown.
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=${{ env.PROJECT }}
          POSTGRES_USER=securevoice
          POSTGRES_PASSWORD=ci-only-not-a-secret
          POSTGRES_DB=securevoice
          BETTER_AUTH_SECRET=ci-only-not-a-secret-ci-only-not-a-secret
          BETTER_AUTH_URL="https://localhost:${CI_CADDY_HTTPS_PORT}"
          SITE_ADDRESS=localhost
          ACME_EMAIL=ci@example.invalid
          SEED_DEMO=false
          ELEVENLABS_DRY_RUN=true
          APP_ENV=staging
          # DATABASE_URL is REQUIRED here, not optional. `docker-compose.yml`
          # passes `BUILD_DATABASE_URL: ${DATABASE_URL}` as a build arg, and
          # compose resolves an unset variable to an EMPTY string — which
          # OVERRIDES the Dockerfile's own default (`ARG BUILD_DATABASE_URL=…`).
          # The image then builds with `ENV DATABASE_URL=` and `bun run build`
          # dies inside the container, while the very same build passes on a
          # developer machine that happens to export DATABASE_URL. Pointing it at
          # the `db` service of THIS CI project keeps the image build and the
          # running container on the same disposable Postgres.
          DATABASE_URL=postgresql://securevoice:ci-only-not-a-secret@db:5432/securevoice?schema=public
          ENV
          echo "wrote a throwaway .env for the CI stack"

      # The host ports come from the override, not from docker-compose.yml,
      # because production already holds 80/443 on this machine.
      #
      # Reclaim smoke networks leaked by earlier runs. The teardown below used to
      # name a fixed project (`securevoice-ci`) while the stack ran under the
      # per-run `$PROJECT`, so every run's `svci-*` network was never removed and
      # they eventually exhausted Docker's default address pool — the stack then
      # failed with "all predefined address pools have been fully subnetted",
      # which is what broke every PR's compose smoke. Removing only `svci-`
      # networks is safe: it never matches production's `securevoice-ai` network,
      # and `docker network rm` refuses any network that still has connected
      # containers, so a concurrently running smoke job is left untouched; stale
      # ones have none and are removed.
      #
      # Networks were only half the leak, and the smaller half. Two more things
      # accumulate, both measured on this box rather than assumed:
      #
      #   VOLUMES — each run leaves `svci-<run>_caddy-config`, `_caddy-data` and
      #     `_db-data` behind. 75 of them had collected (3.3 GB). `down -v` is
      #     supposed to take them but does not, so they are removed by name here.
      #
      #   BUILD CACHE — `docker compose build` writes cache that `down` never
      #     touches. 79 entries, 0 active, 22.5 GB: the single largest consumer
      #     on the disk and roughly seven times the volume leak. This is what
      #     actually filled the disk.
      #
      # Together those two brought the runner from 79% full (21 GB free) to 60%
      # (39 GB free) in one pass. Reclaiming only the networks, as this step used
      # to, left both of them growing on every run.
      - name: Reclaim leaked CI volumes and build cache
        run: |
          set -uo pipefail
          # Only `svci-` names are candidates, so `securevoice-ai_*` and
          # `crucible_deployed` — the volumes production is actually using —
          # cannot be matched. A volume still referenced by any container is
          # skipped, so a concurrently running smoke job is never disturbed.
          for v in $(docker volume ls --format '{{.Name}}' | grep '^svci-' || true); do
            if [ -z "$(docker ps -a --filter volume="$v" --format '{{.Names}}' 2>/dev/null)" ]; then
              docker volume rm "$v" >/dev/null 2>&1 || true
            fi
          done

          # Build cache older than 3 days. Not `-a`: this runner also builds the
          # production image on deploy, and wiping its whole cache would make the
          # next deploy a full rebuild for no benefit. 3 days keeps the deploy
          # path warm while bounding what CI can accumulate.
          docker builder prune --force --filter 'until=72h' 2>&1 | tail -2 || true

      - name: Build and start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" up -d --build --wait --wait-timeout 300

      - name: Report status
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" logs --no-color --tail 200

      # Prove the smoke test did not disturb the production stack. Without this
      # the isolation above is an untested assumption, and the first regression
      # would be discovered by a judge hitting an outage instead of by CI.
      #
      # Read the label off the containers themselves rather than asking compose
      # to enumerate the project: this runs in the runner's checkout, and
      # `docker compose -p … ps` there resolves against ITS compose file, which
      # is not what answers "is production still up?".
      - name: Production stack untouched
        if: always()
        run: |
          up=$(docker ps --filter "label=com.docker.compose.project=securevoice-ai" \
                 --filter status=running --format '{{.Names}}' | wc -l)
          echo "production containers running: $up"
          if [ "$up" -lt 7 ]; then
            echo "::error::production has $up/7 containers running — a smoke-test job disturbed it"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            https://57.130.80.158.sslip.io/api/health || true)
          echo "production api/health: $code"
          [ "$code" = "200" ] || { echo "::error::production origin is not healthy"; exit 1; }

      # Caddy is the only published port, so this is the real ingress path.
      - name: HTTPS through Caddy
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost:${CI_CADDY_HTTPS_PORT}"/api/health || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "api/health via Caddy: $code"
          test "$code" = "200"

      - name: SPA served through Caddy
        run: test "$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost:${CI_CADDY_HTTPS_PORT}"/)" = "200"

      # Proves the socket route is wired to the realtime service, without needing a
      # signing secret or a browser: Engine.IO answers a handshake on that path.
      - name: Realtime route reachable through the proxy
        run: |
          # Double quotes, not single: the port is a per-run variable, and single
          # quotes would hand the literal string `$CI_CADDY_HTTPS_PORT` to curl,
          # which then failed against nothing.
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            "https://localhost:${CI_CADDY_HTTPS_PORT}/realtime/?EIO=4&transport=polling")
          echo "realtime polling via Caddy: $code"
          test "$code" = "200"

      - name: Realtime port is not published to the host
        run: |
          # The origin must stay internal or the edge rate-limit trust model breaks.
          if docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" ps realtime --format '{{.Ports}}' | grep -qE '0\.0\.0\.0|::'; then
            echo "realtime is published to the host — expected expose-only"
            exit 1
          fi
          echo "realtime is expose-only, as intended"

      # Always tears down the CI project ONLY, and it must name the SAME per-run
      # project that "Build and start the stack" created ($PROJECT). Naming a
      # fixed project here (as this used to) tears down nothing and leaks the
      # run's network — the bug that exhausted the address pool. `$PROJECT` is
      # written to $GITHUB_ENV by the allocate step, so it is in scope here.
      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" down -v --remove-orphans || true
          rm -f .env

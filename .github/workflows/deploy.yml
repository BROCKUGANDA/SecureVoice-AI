name: Deploy

# Push-to-main deploy: SSH into the VPS, pull, rebuild the app + workers,
# roll them. The Caddyfile on the VPS is VPS-local (per-site blocks for the
# shared edge) and is protected with `git update-index --skip-worktree`, so
# the pull never trips over it.
#
# The job stays green before VPS_DEPLOY_KEY is configured: the deploy step is
# skipped until the repository secret exists.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "evidence/**"
  # Manual run — this repo has a history of push events recording a synthetic
  # `startup_failure` (path "BuildFailed") without ever starting a step; a
  # dispatch is the fastest way to prove whether Actions can run at all.
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, securevoice-vps]
    steps:
      - name: Check for deploy key
        id: key
        env:
          HAS_KEY: ${{ secrets.VPS_DEPLOY_KEY != '' }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS (pull, build, migrate, roll app + workers)
        if: steps.key.outputs.has_key == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 57.130.80.158
          username: ubuntu
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/securevoice-ai
            git pull --ff-only origin main
            # db-setup is in the build list on purpose. It is the image that runs
            # `migrate deploy`, and it is a separate compose image from `app` even
            # though both come from the same `builder` stage — so `build app` alone
            # leaves db-setup on whatever migration set was baked the last time it
            # happened to be rebuilt. That is not a theoretical hazard: a deploy that
            # printed "No pending migrations to apply" against a database missing
            # three migrations was compose reusing a stale db-setup image.
            docker compose build app dial-worker retention-worker db-setup
            # Schema before code. The runner image is `oven/bun:1-slim` plus the
            # standalone bundle: it has no Prisma CLI and no prisma/migrations, so
            # the app container cannot migrate itself, and a deploy that only rolls
            # containers leaves the database one column behind the code that reads
            # it — which surfaces as a 500 on the request that touches the new
            # field, not as a failed deploy. `sh -c` overrides db-setup's entrypoint
            # so this applies migrations WITHOUT re-seeding demo cases into a live
            # database, and --no-deps keeps it off the app's dependency graph.
            docker compose run --rm --no-deps db-setup sh -c "bunx prisma migrate deploy"
            docker compose up -d app dial-worker retention-worker

      - name: Smoke test the running origin
        if: steps.key.outputs.has_key == 'true'
        run: |
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://57.130.80.158.sslip.io/api/health || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "health: $code"
          test "$code" = "200"

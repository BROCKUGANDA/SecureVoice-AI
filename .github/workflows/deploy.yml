# ---------------------------------------------------------------------------
# SecureVoice AI — deploy to production
#
#   main ──▶ build ──▶ migrate ──▶ roll app + workers ──▶ health check
#
# TWO PATHS IN, ONE ROLL
#
#   green main  → build `app` from source, roll it
#   v* release  → pull `app` from GHCR (the image release.yml published and
#                 smoke-tested), roll that
#
# The release path exists because releases used to be decorative. release.yml
# built, stamped and published a tagged image that nothing deployed; production
# ran whatever `docker compose build` produced from whatever was on main. A
# version number on a tag therefore said nothing about what was actually serving
# traffic. Now the tag is the thing that gets rolled.
#
# The health check targets the ORIGIN's own address, not the public hostname.
# That is deliberate: the public name now sits behind the Cloudflare proxy, so a
# check through it would test Cloudflare as much as the app and would go red for
# reasons that have nothing to do with the deploy. Checking the origin directly
# proves the thing that was just rolled.
#
# WHAT CHANGED, AND WHY IT HAD TO
#
# This used to SSH into 57.130.80.158 with appleboy/ssh-action to run the deploy.
# It now runs the same commands DIRECTLY, because CI executes on that machine —
# the self-hosted runner `securevoice-vps` lives there. SSH-ing into the box
# from the box was a loop that bought nothing and needed the deploy private key
# inside the runner for no reason.
#
# It also no longer deploys on an untested commit. `on: workflow_run` fires this
# only after the CI workflow FINISHES on `main`, and the first step refuses any
# run whose conclusion was not `success`. Previously a push to main started a
# deploy in parallel with CI, so a red build could still roll forward.
#
# The Caddyfile is byte-identical between this repo and the box: the shared
# edge's extra hostnames (crucible.svalley.tech) live in an untracked
# sites.d/*.caddy that the tracked Caddyfile imports, so a promoted change to
# the Caddyfile pulls and deploys like any other file. It used to be the
# opposite — a skip-worktree'd box-local copy, where every promoted Caddyfile
# change made the pull refuse until an operator merged by hand. See
# docs/VPS-RECOVERY.md failure mode #2 for that history.
# ---------------------------------------------------------------------------
name: Deploy

on:
  # SINGLE workflow_run trigger, and it must stay a mapping, not a list.
  #
  # GitHub Actions' `on: workflow_run:` accepts ONE mapping with ONE `workflows`
  # list. It does NOT accept a sequence of trigger objects — a merge briefly
  # produced both a `- workflows: ["CI"]` and a `- workflows: ["Release"]`
  # entry, and actionlint rejects that outright:
  #
  #     .github/workflows/deploy.yml:44:3: no workflow is configured for
  #     "workflow_run" event [events]
  #     .github/workflows/deploy.yml:60:5: "workflow_run" section is sequence
  #     node but mapping node is expected [syntax-check]
  #
  # Both errors are fatal and take the whole CI job red, which stops the
  # promotion ladder at the dev -> staging edge. Verified against the
  # rhysd/actionlint image: this mapping form passes; the sequence form fails.
  #
  # The Release path is therefore handled by `workflow_dispatch` below plus the
  # resolve step inside the job, which reads the tag and behaves accordingly.
  # A tag push cannot trigger `workflow_run` anyway (it has no branch), which is
  # why the release path was already hand-dispatched before it worked.
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  # Manual re-run, for when the machine was down during an automatic deploy, and
  # for releasing a tagged, provenance-stamped image explicitly. `workflow_run`
  # can only reference ONE upstream workflow, so the Release path comes in here
  # and the job resolves what it is deploying from the SHA or tag.
  workflow_dispatch:

permissions:
  contents: read

# Two deploys must never interleave: a half-applied migration followed by a
# second `git pull` is how a schema ends up ahead of the code that reads it.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate and roll production
    runs-on: [self-hosted, securevoice-vps]
    # A GitHub Environment is what puts a Deployment record — and the URL below
    # — on the repository's Deployments tab. Without it the deploy is real but
    # invisible: the run goes green, the VPS is rolled, and the Deployments view
    # stays empty, which is indistinguishable from "the deploy never happened".
    #
    # `production` has no protection rules (verified against the API: the only
    # environment that exists is `copilot`), so declaring it here does not gate
    # the automatic roll — it records it. GitHub creates the environment on the
    # first run that references it.
    environment:
      name: production
      url: https://securevoiceai.me
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      # The gate. A failed CI run must never deploy, however it was triggered,
      # and `workflow_dispatch` has no upstream run to inspect — so the manual
      # path proves the tree is green by asking GitHub.
      - name: Refuse to deploy an unproven commit
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual deploy: verifying CI on main is currently green"
            code=$(gh api "repos/$GITHUB_REPOSITORY/commits/main/check-runs" \
              --jq '[.check_runs[] | select((.name | startswith("Lint, typecheck"))
                      or (.name | startswith("Compose stack")))] | .[0].conclusion')
            [ "$code" = "success" ] || {
              echo "::error::CI on main is not green (got '${code:-none}') — refusing a manual deploy."
              exit 1
            }
            echo "CI on main: $code"
            exit 0
          fi

          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::CI run ${RUN_ID} concluded '${RUN_CONCLUSION}'. Production only deploys what CI proved green."
            exit 1
          fi
          echo "CI run ${RUN_CONCLUSION}: ${RUN_ID}"

      # Which upstream fired this, and — on the release path — which tag.
      #
      # `workflow_run.name` is the discriminator. The tag is NOT taken from
      # `github.ref`: on a workflow_run trigger, `github.ref` is the DEFAULT
      # branch, not the tag that was pushed. Reading the tag from the wrong field
      # is the classic way a "wired up" release deploy ends up deploying `:main`.
      - name: Resolve what is being deployed
        run: |
          set -euo pipefail
          UPSTREAM="${{ github.event.workflow_run.name }}"
          if [ "$UPSTREAM" = "Release" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
            case "$TAG" in
              v*) ;;
              *) echo "::error::release run has no v* tag (head_branch='${TAG}') — refusing to deploy."; exit 1 ;;
            esac
            # One redirect block, not three separate `echo >>` lines: shellcheck
            # SC2129 flags those, the CI actionlint job treats it as a failure,
            # and a red actionlint job stalls the promotion ladder.
            {
              echo "DEPLOY_SOURCE=release"
              echo "RELEASE_TAG=${TAG}"
              echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${TAG}"
            } >> "$GITHUB_ENV"
          else
            echo "DEPLOY_SOURCE=branch" >> "$GITHUB_ENV"
            echo "branch deploy: rolling whatever main proves green"
          fi

      # The tag must point at what is actually on main.
      #
      # Without this, a tag cut from an old commit would deploy that old commit's
      # source for the workers while `app` came from the newer published image —
      # two versions of the codebase running against one database, which is the
      # "schema ahead of the code that reads it" class of bug this file already
      # guards against for migrations. Refusing is cheap; debugging it live is not.
      #
      # This is also what lets the release path keep checking out `main` below
      # instead of detaching onto the tag: the box is a `main` checkout, and
      # every deploy path — automatic or manual — expects to find it there.
      - name: Refuse a release whose tag is not on main
        if: env.DEPLOY_SOURCE == 'release'
        run: |
          set -euo pipefail
          cd ~/securevoice-ai
          git fetch origin main --tags --force --quiet
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          main_sha=$(git rev-list -n 1 origin/main)
          echo "tag  $RELEASE_TAG -> ${tag_sha}"
          echo "main           -> ${main_sha}"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::${RELEASE_TAG} does not point at origin/main."
            echo "::error::Cut the tag on main, or re-run the deploy from the branch path."
            exit 1
          fi

      - name: Log in to GHCR
        if: env.DEPLOY_SOURCE == 'release'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the released image
        if: env.DEPLOY_SOURCE == 'release'
        run: |
          set -euo pipefail
          cd ~/securevoice-ai
          docker compose pull app
          echo "pulled ${IMAGE}"

      # `~/securevoice-ai` is the live checkout, not the runner's throwaway
      # workspace. The runner copies the tree to a fresh directory per job, so
      # the deploy has to act on the real one.
      #
      # Ask the disk whether it can take a build, before spending twenty-five
      # minutes of build on the assumption that it can. This is the same preflight
      # the compose smoke job runs (`scripts/runner-preflight.ts` — free space, free
      # inodes, and a real 4 MiB fdatasync latency, each with a floor), and the deploy
      # needs it more than CI does: a deploy that dies mid-roll leaves production on
      # the commit the last successful step managed to move.
      #
      # It runs after checkout because it is a repo script, which also means a disk at
      # literal zero can fail before the script is ever reached. That is why the cron
      # in `scripts/runner-hygiene.sh` is the other half, and why it is not a workflow.
      - name: Preflight the runner disk
        run: bun scripts/runner-preflight.ts --min-gb 10

      # Reclaim the disk BEFORE pulling and rolling, for the reason the smoke job has
      # the same step: per-run `svci-<run>-<attempt>-*` images (306 of them once,
      # ~66 GB), the CI compose projects' networks and volumes, the containers a
      # cancelled run left holding them, and the anonymous volumes no name filter can
      # see — `postgres:16-alpine` declares a VOLUME, so every throwaway test database
      # used to leave one behind. All of it is one policy now, in
      # `scripts/reclaim-ci.sh`, called from CI's two sites and from here.
      #
      # An earlier draft of this comment claimed the deploy job never checks the tree
      # out, so it could not call the script. That was wrong — `actions/checkout` is
      # this job's first step, 110 lines above — and the mistake is worth keeping in
      # the file rather than editing out, because "this one is different, let it keep
      # its own copy" is how three reclaim loops with three scopes and one shared blind
      # spot were justified in the first place.
      - name: Reclaim CI garbage before the roll
        run: TARGET_DIR="$HOME/securevoice-ai" bash scripts/reclaim-ci.sh reclaim

      # ── Feature flags: repository variable → box .env → rolling containers ──
      #
      # The registry (src/lib/flags.ts) reads FEATURE_* from each process's
      # environment. On the box that env is ~/securevoice-ai/.env, which compose
      # reads for `app` directly (env_file) and interpolates into each worker's
      # `environment:` block. Nothing before this step connected the GitHub side
      # to that file, so a flag "set in GitHub" existed nowhere: the run said
      # nothing, .env said nothing, and the console kept showing the old state.
      #
      # Precedence, stated once and enforced below: a repository variable that
      # is SET is authoritative and is written into .env; a variable that is
      # UNSET is left exactly as the box has it, so deleting a variable can
      # never silently clobber a box-local setting. Values must be exactly
      # true/false — same loud-failure doctrine as the registry reader, because
      # a typo'd flag that reads as "off" is a feature that silently vanished.
      #
      # The summary table below is the visibility half: it lands on the run's
      # own page, so "which flags is production running, and where did each
      # value come from" is answerable from GitHub without SSH.
      - name: Apply feature flags from repository variables
        env:
          FEATURE_REALTIME: ${{ vars.FEATURE_REALTIME }}
          FEATURE_ELEVEN_LABS_LIVE: ${{ vars.FEATURE_ELEVEN_LABS_LIVE }}
          FEATURE_PII_REDACTION: ${{ vars.FEATURE_PII_REDACTION }}
          FEATURE_CONSOLE_LIVE_FEED: ${{ vars.FEATURE_CONSOLE_LIVE_FEED }}
          FEATURE_COMPLIANCE_DISCLOSURE: ${{ vars.FEATURE_COMPLIANCE_DISCLOSURE }}
          FEATURE_COMPLIANCE_NO_SECRETS: ${{ vars.FEATURE_COMPLIANCE_NO_SECRETS }}
          FEATURE_COMPLIANCE_PII_REDACTION: ${{ vars.FEATURE_COMPLIANCE_PII_REDACTION }}
          FEATURE_SEED_DEMO: ${{ vars.FEATURE_SEED_DEMO }}
          FEATURE_WEBHOOK_STRICT_SIGNATURES: ${{ vars.FEATURE_WEBHOOK_STRICT_SIGNATURES }}
          FEATURE_TWILIO_MEDIA_STREAMS: ${{ vars.FEATURE_TWILIO_MEDIA_STREAMS }}
        run: |
          set -euo pipefail
          cd ~/securevoice-ai
          touch .env
          rows=()
          apply() {
            key="$1"
            val="${!key:-}"
            case "$val" in
              "")
                rows+=("| \`${key}\` | — | unset in GitHub; box .env (or registry default) stands |")
                return 0
                ;;
              true|false) ;;
              *)
                echo "::error::${key} must be exactly true or false (got '${val}') — refusing to write it."
                exit 1
                ;;
            esac
            if grep -q "^${key}=" .env; then
              awk -v k="$key" -v v="$val" 'index($0, k"=") == 1 { print k"="v; next } { print }' .env > .env.flags.tmp
              mv .env.flags.tmp .env
              rows+=("| \`${key}\` | \`${val}\` | updated in .env |")
            else
              echo "${key}=${val}" >> .env
              rows+=("| \`${key}\` | \`${val}\` | appended to .env |")
            fi
          }
          apply FEATURE_REALTIME
          apply FEATURE_ELEVEN_LABS_LIVE
          apply FEATURE_PII_REDACTION
          apply FEATURE_CONSOLE_LIVE_FEED
          apply FEATURE_COMPLIANCE_DISCLOSURE
          apply FEATURE_COMPLIANCE_NO_SECRETS
          apply FEATURE_COMPLIANCE_PII_REDACTION
          apply FEATURE_SEED_DEMO
          apply FEATURE_WEBHOOK_STRICT_SIGNATURES
          apply FEATURE_TWILIO_MEDIA_STREAMS
          {
            echo "### Feature flags (applied to this deploy)"
            echo ""
            echo "| flag | value | action |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${rows[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${rows[@]}"

      - name: Build, migrate and roll the live stack
        env:
          # The commit the upstream CI run proved, i.e. what this deploy is allowed to
          # ship. Empty on a `workflow_dispatch`, which has no upstream run and rolls
          # the tip. Same expression the drift-gate step below passes as DEPLOY_SHA —
          # feeding it to BOTH is the point: the roll lands on it and the gate checks
          # the roll landed on it. They disagreed before, and that disagreement is the
          # failing deployment.
          PROVEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cd ~/securevoice-ai
          git fetch origin main
          git checkout main
          # The Caddyfile is NOT box-local anymore. Host-local sites live in
          # untracked sites.d/*.caddy (imported by the tracked Caddyfile), so
          # the tracked file is byte-identical everywhere and a promoted change
          # to it pulls like any other file. The skip-worktree flag is retired
          # — clear it in case an older deploy left it behind, because a
          # lingering flag would pretend local edits are clean (measured:
          # flag + diverged file = refused pull; flag + clean file = clean
          # pull). History: docs/VPS-RECOVERY.md, failure mode #2.
          git update-index --no-skip-worktree Caddyfile Caddyfile.platform 2>/dev/null || true

          # ── Park box-local files that main has started to track ───────────────
          #
          # Measured 2026-10-13: this deploy died two seconds in, on every green
          # main, with
          #   error: The following untracked working tree files would be
          #   overwritten by merge: scripts/drift-gates.mjs
          #   Aborting
          # Someone had written that script straight onto the box while debugging,
          # and the commit that added it to the repository arrived later. Git will
          # not silently overwrite an untracked file, so one stray copy held a
          # 154-commit roll hostage — and the log made it look like a build error.
          #
          # The files are MOVED, never deleted, and only for paths this range
          # actually writes. `git clean` is not the answer: the same checkout holds
          # host-local state with no other copy (.env carries live secrets,
          # sites.d/*.caddy is imported by the tracked Caddyfile), and a clean here
          # would take production down to fix a pull.
          #
          # A collision on host-local state is a decision nobody should make at
          # 3am inside an automated roll, so it stops the deploy loudly instead of
          # guessing.
          INCOMING_SHA="$(git rev-parse origin/main)"
          COLLISION_DIR=".deploy-local-collisions"
          parked=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || continue
            git ls-files --error-unmatch -- "$path" >/dev/null 2>&1 && continue
            case "$path" in
              .env|.env.*|sites.d/*)
                echo "::error::$path is untracked on the box AND tracked by incoming main."
                echo "::error::this is host-local state — reconcile it by hand, do not let a roll move it."
                exit 1
                ;;
            esac
            dest="$COLLISION_DIR/$INCOMING_SHA/$path"
            mkdir -p "$(dirname "$dest")"
            mv -- "$path" "$dest"
            echo "parked box-local copy: $path -> $dest"
            parked=$((parked + 1))
          done < <(git diff --name-only -z HEAD "$INCOMING_SHA" --)
          if [ "$parked" -gt 0 ]; then
            echo "$parked box-local file(s) parked under ${COLLISION_DIR}/${INCOMING_SHA}/."
            echo "diff them against the tracked versions; nothing here deletes them."
          fi

          # Roll to the commit CI PROVED, not to whatever origin/main's tip happens to
          # be when this line runs.
          #
          # The bug this closes: the deploy was dispatched for `e62869b`, the box pulled,
          # and landed on `9c10176` — because AutoVersion had cut a release bump onto main
          # in the minutes between CI going green and this step fetching. So the roll built
          # and shipped a commit no CI run was ever about, then the drift gate correctly
          # refused it (`the box is at 9c10176 but this deploy was dispatched for e62869b`),
          # the health-check step was skipped, and the deploy went red with production
          # serving an unproven build. Run 39291741875, and it recurs on any deploy that
          # overlaps a bump — which, because AutoVersion bumps main in response to main
          # going green, is most of them.
          #
          # `git checkout -B main "$PROVEN_SHA"` rather than a merge, because the box can
          # legitimately be AHEAD of the dispatched commit (it is right now): a fast-forward
          # to an ancestor is a no-op that would leave the unproven build running and fail the
          # gate forever. Moving the branch to the proven commit restores the invariant —
          # production runs exactly what CI proved — and the newer commit arrives by its own
          # green run. Nothing is lost: origin still holds it.
          #
          # `git merge --ff-only origin/main`, NOT `git pull --ff-only origin main`, on the
          # manual path: the 2026-10-14 v0.2.14 deploy died right there on a branch git had
          # just reported as fast-forwardable, saying "Cannot fast-forward to multiple
          # branches", because a bare branch name leaves git resolving the merge subject
          # through FETCH_HEAD while pull re-fetches in the same step. A `workflow_dispatch`
          # has no upstream run, so it still rolls the tip — and the gate holds it to tip
          # equality for exactly that reason.
          if [ -n "${PROVEN_SHA:-}" ]; then
            git checkout -B main "${PROVEN_SHA}"
          elif ! git merge --ff-only origin/main; then
            echo "::error::git merge --ff-only refused to roll ~/securevoice-ai forward."
            echo "--- git status --short ---"
            git status --short || true
            echo "--- HEAD vs origin/main ---"
            git rev-parse HEAD origin/main 2>/dev/null || true
            echo "--- HEAD..origin/main ---"
            git log --oneline HEAD..origin/main 2>/dev/null | head -20 || true
            echo "--- origin/main..HEAD (local commits main does not have) ---"
            git log --oneline origin/main..HEAD 2>/dev/null | head -20 || true
            exit 1
          fi
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "deployed commit: ${DEPLOY_SHA:0:12}"

          # ── Roll by IMMUTABLE tag, never by the shared `local` tag ─────────────
          #
          # The stale-image incident this replaces: on the branch path `IMAGE` was
          # never exported, so docker-compose.yml's `${IMAGE:-securevoice-ai-app:local}`
          # resolved EVERY build — production deploys, CI smoke builds, and a manual
          # `docker compose build` typed by an operator — to one mutable tag. Any of
          # them could retag it with a different build, and the next `up -d` resolved
          # `app.image` to whatever the tag happened to point at rather than to the
          # image just built. That is how production ends up serving the previous
          # release's UI with a green deploy log: nothing in the pipeline ever
          # asserted that the running container is the build that was just made.
          #
          # The release path already rolled by tag (ghcr.io/…:${TAG}) and was never
          # affected. Only the branch path was. So the SHA tag is applied here, on
          # the box, AFTER the pull — which is the only place the SHA is authoritative
          # — and only when this is not a release, whose IMAGE comes from GITHUB_ENV.
          #
          # A per-SHA tag also makes `up -d` deterministic: the tag is written once
          # by this build and can only be overwritten by a rebuild of that exact SHA.
          if [ "$DEPLOY_SOURCE" != "release" ]; then
            export IMAGE="securevoice-ai-app:${DEPLOY_SHA:0:12}"
            echo "rolling immutable tag ${IMAGE}"
          fi

          # db-setup is in the build list on purpose. It is the image that runs
          # `migrate deploy`, and it is a separate compose image from `app` even
          # though both come from the same `builder` stage — so `build app` alone
          # leaves db-setup on whatever migration set was baked the last time it
          # happened to be rebuilt. That is not a theoretical hazard: a deploy that
          # printed "No pending migrations to apply" against a database missing
          # three migrations was compose reusing a stale db-setup image.
          #
          # On the RELEASE path `app` is deliberately absent from this list: it was
          # pulled from GHCR, and rebuilding it would replace the published,
          # provenance-stamped artifact with a fresh local compile — so the running
          # version would again be something no release describes. The workers and
          # db-setup are still built from the checked-out tree (they run from
          # source, not from the bundle), and the tag-is-on-main gate above
          # guarantees that tree IS the released commit.
          # ONE LIST, EXPANDED BY BOTH THE BUILD AND THE ROLL.
          #
          # These used to be two literal lists, and they had silently drifted:
          # `up -d` named overage-worker and outbox-worker while `build` named
          # neither. Compose then reused whatever each service's tag last pointed
          # at. Measured on the box after the 2026-10-17 deploy reported success
          # against every gate: the TLS-anchor fix lives in the Dockerfile's
          # `worker` stage — the exact stage both of those services build from —
          # and it never reached them.
          #
          #   overage-worker  anchor missing, `paddleSubscription.findMany()`
          #                   ENOENT, "[overage-worker] run failed"
          #   outbox-worker   running an image built before the fix
          #
          # `checkBoxImageConformance` could not see this: it asks whether the
          # running image is TAGGED by something, and a stale image is still
          # tagged. A rolled-but-never-built service is the same class of hole as
          # the never-rolled ones above, seen from the other side, and `checkBuildRollSymmetry`
          # in scripts/drift-gates.mjs now fails CI if the two lists ever diverge.
          ROLLED=(dial-worker retention-worker voice-stream-worker email-worker overage-worker outbox-worker)
          if [ "$DEPLOY_SOURCE" = "release" ]; then
            docker compose build "${ROLLED[@]}" db-setup
          else
            docker compose build app "${ROLLED[@]}" db-setup
          fi

           # Schema before code. The runner image is `oven/bun:1-slim` plus the
           # standalone bundle: it has no Prisma CLI and no prisma/migrations, so
           # the app container cannot migrate itself, and a deploy that only rolls
           # containers leaves the database one column behind the code that reads
           # it — which surfaces as a 500 on the request that touches the new
           # field, not as a failed deploy. `sh -c` overrides db-setup's entrypoint
           # so this applies migrations WITHOUT re-seeding demo cases into a live
           # database, and --no-deps keeps it off the app's dependency graph.
           docker compose run --rm --no-deps db-setup sh -c "bunx prisma migrate deploy"

           # THE LIST IS THE INVENTORY, and that is the trap. Measured on this box
           # 2026-10-12: `overage-worker` is in docker-compose.yml and has NEVER
           # had a container — `docker ps -a --filter name=overage` is empty — for
           # exactly as long as the service has existed in the file, because it was
           # never added to this command. A service nobody rolls is not an error
           # anywhere; it is an absence nobody sees, and the overage billing that
           # worker computes simply did not run.
           #
           # scripts/drift-gates.mjs now compares this list against
           # docker-compose.yml and fails CI on any service with no declared role
           # (rolled / one-shot / infra-with-a-reason), so a future addition cannot
           # be forgotten the same way. The box gate in the same script then
           # verifies the claim on the live host after the roll.
           #
           # 2026-10-16: `outbox-worker` was the next one. It drains the durable
           # bank-notification outbox (`scripts/outbox-worker.ts --loop 10`) and was
           # classified INFRA as "rolled rarely", which read plausibly and meant it
           # was in fact never rolled at all: the compose `depends_on` is identical
           # to every other worker's, so there was no db-setup reason to exclude it,
           # and `checkBoxImageConformance` only ever inspected the app container, so
           # no gate could see the drift. Bank deliveries therefore ran on whatever
           # image was first built — including after a signing or schema change.
           docker compose up -d app "${ROLLED[@]}"
           docker compose ps

           # ── Prove the roll actually happened ─────────────────────────────────
           #
           # `docker compose ps` printing a row is not evidence that the new build is
           # the one running: compose recreates a container only when it decides the
           # image or config changed, and it prints a healthy row either way. This is
           # the check that was missing when the stale image shipped — the deploy
           # reported success because nothing had failed, not because the right
           # artifact was serving traffic.
           #
           # Compare the image ID the build produced against the ID the running
           # container was created from. Those are two different questions, and only
           # the second one is about production.
           BUILT_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}")"
           RUNNING_ID="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q app)")"
           echo "built   ${BUILT_ID}"
           echo "running ${RUNNING_ID}"
           if [ "$BUILT_ID" != "$RUNNING_ID" ]; then
             echo "::error::production is NOT serving the build that was just made."
             echo "::error::built=${BUILT_ID} running=${RUNNING_ID} (${IMAGE})"
             echo "::error::this is the stale-image condition — do not report this deploy as successful."
             exit 1
           fi
           echo "verified: the running app container is exactly ${IMAGE}"

           # Retire the ambiguous shared tag. `securevoice-ai-app:local` was the
           # whole mechanism behind the stale-image incident: it was a mutable name
           # that any build could claim, so it outlives the deploy that wrote it and
           # stays resolvable by anything that runs compose without IMAGE set. Once
           # production rolls by SHA there is no reason to keep a second, vaguer
           # name for the same artifact on the box.
           #
           # Guarded, and only on the branch path: the release path's IMAGE is a
           # remote GHCR ref that was pulled, not built here, so removing a local
           # tag is not its business.
           if [ "$DEPLOY_SOURCE" != "release" ] && docker image inspect "securevoice-ai-app:local" >/dev/null 2>&1; then
             if [ "$(docker image inspect --format '{{.Id}}' securevoice-ai-app:local)" != "$BUILT_ID" ]; then
               docker image rm "securevoice-ai-app:local" >/dev/null 2>&1 || true
               echo "retired securevoice-ai-app:local (pointed at a different build)"
             fi
           fi

      # ── the drift gate, run against what actually just rolled ──────────────
      #
      # Not a lint pass: this asks the box questions. Does every compose service
      # have a running container (the overage-worker class)? Is the box's HEAD
      # origin/main's tip, or is production serving a commit that is not main
      # (which is what silently happened while AutoVersion was blocked)? Is the
      # running app image actually tagged, or dangling the way the stale-image
      # incident left it? A deploy that answers "green" while any of those drift
      # is a deploy that lied.
      - name: Drift gates against the rolled stack
        # BOX_DIR, not `cd`. The box checkout has no node_modules — the app runs in
        # containers there — so executing the script from inside it would fail on the
        # `yaml` import instead of checking anything. What the box gates need is the
        # box's compose project and the box's git HEAD, and they now take both from
        # this variable while bun keeps resolving in the workspace it installed into.
        # Without it the gate measured the runner workspace and reported all twelve
        # services as never-created on a healthy stack (measured 2026-10-13: compose
        # exits 1 there on missing POSTGRES_PASSWORD / BETTER_AUTH_SECRET, because the
        # .env belongs to the box checkout).
        env:
          # The commit this deploy was DISPATCHED for — the upstream CI run's head —
          # not whatever origin/main happens to read when the gate runs. `autoversion`
          # cuts release bumps onto main mid-rollout, and the tip comparison called a
          # correct deploy drift (run 39173983527: box on 53b3554, tip moved to
          # 121a860), which then skipped the health check step after it. Empty on a
          # workflow_dispatch, where there is no upstream run and the tip IS the
          # contract — checkBoxCurrency falls back to that.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: BOX_DIR="$HOME/securevoice-ai" bun scripts/drift-gates.mjs box

      - name: Health check the rolled origin
        env:
          # A wall-clock budget, not an attempt count. HARDENING, not the fix
          # for the 2026-10-14 failure — that deploy died upstream on the git
          # fast-forward and never reached this step, so this gate's behaviour
          # that day says nothing either way. It is here because it is the
          # next thing to be wrong: 6 attempts with a 10s sleep is a bare count,
          # so its real window was however long curl happened to take, and a
          # cold app recreate plus seven workers can outlast that.
          HEALTH_DEADLINE_SECONDS: "300"
          HEALTH_INTERVAL_SECONDS: "10"
        run: |
          # The public hostname Caddy serves. The 57.130.80.158.sslip.io
          # stand-in was retired 2026-10-12 — its site block is gone from the
          # box Caddyfile and its DNS record is deleted, so probing it here
          # would time out on a healthy origin.
          #
          # Every attempt is logged, so a failure below names the SHAPE of the
          # outage instead of only its end state: a run of `000` is DNS or
          # Caddy, a run of `502` is the app not accepting yet, and a `500`
          # that never moves is the app up and broken — three very different
          # pages of a runbook. The old gate printed one `health:` line after
          # its last attempt and discarded the rest.
          deadline=$(( $(date +%s) + HEALTH_DEADLINE_SECONDS ))
          attempt=0
          code=""
          while :; do
            attempt=$(( attempt + 1 ))
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://securevoiceai.me/api/health || true)
            # Every attempt is logged, so a failure below names the shape of
            # the outage instead of only its end state: a run of `000` is DNS
            # or Caddy, a run of `502` is the app not accepting yet, and a
            # `500` that never moves is the app up and broken — three very
            # different pages of a runbook.
            echo "health attempt ${attempt}: ${code:-no-response}"
            if [ "$code" = "200" ]; then
              echo "origin healthy after ${attempt} attempt(s)"
              exit 0
            fi
            # `if`, not `[ ... ] && break`: under the runner's `bash -e` a false
            # `&&` short-circuit as the last command in a loop body exits the whole
            # step on the first iteration. Verified against `bash -eo pipefail`
            # with a mocked curl across the 200 / 503-then-200 / 500 / 000 paths.
            if [ "$(date +%s)" -ge "$deadline" ]; then
              break
            fi
            sleep "$HEALTH_INTERVAL_SECONDS"
          done

          echo "::error::origin did not answer 200 within ${HEALTH_DEADLINE_SECONDS}s (last status: ${code:-no-response})"
          test "$code" = "200"

      # A deploy that reports success while the app is unhealthy is worse than a
      # loud failure: it writes a green tick next to a broken origin. If the
      # container is not running, name the reason from its own logs.
      # Named for what it actually covers. This used to be "Report if the origin is
      # unhealthy", which was a lie for every failure that was not the origin:
      # the 2026-10-14 v0.2.14 deploy died on the git fast-forward with the
      # origin perfectly healthy, and this step still printed "production origin
      # did not come up" over a stack whose containers were all `Up (healthy)`.
      # That message sent the investigation to /api/health instead of to the
      # checkout. It dumps state; it does not diagnose, so it must not claim to.
      - name: Dump stack and runner state after any failure
        if: failure()
        run: |
          echo "::error::deploy failed before the origin was confirmed healthy."
          echo "::error::the step that failed is named above; this dump is state, not a diagnosis."
          echo "--- HEAD vs origin/main ---"
          cd ~/securevoice-ai && git rev-parse HEAD origin/main 2>/dev/null || true
          echo "--- stack ---"
          docker compose ps
          echo "--- app and worker logs ---"
          docker compose logs --no-color --tail 150 app dial-worker retention-worker email-worker
          exit 1

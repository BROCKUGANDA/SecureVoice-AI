# ---------------------------------------------------------------------------
# SecureVoice AI — promotion ladder
#
#   dev ──▶ staging ──▶ main
#     │          │         │
#     │          │         └─ PRODUCTION: deploys to the VPS on push.
#     │          └─ PRE-PRODUCTION: the APP_ENV gate refuses to dial a real
#     │             customer, so this is where a change is proven live.
#     └─ integration branch: every commit lands here first.
#
# WHY AUTOMATIC, AND WHY IT IS STILL SAFE
#
# Promotion opens a pull request and then ENABLES AUTO-MERGE. The PR is not
# merged by this workflow — GitHub merges it only once every required status
# check on the PR is green. So the ladder is:
#
#     push to dev  ─▶ PR dev→staging opened ─▶ auto-merge WHEN CI IS GREEN
#        merge to staging ─▶ PR staging→main opened ─▶ auto-merge WHEN CI IS GREEN
#           merge to main ─▶ Deploy workflow runs ─▶ VPS rolls forward
#
# The review that remains is the code review that happened on the way UP, not a
# second ceremony on the way down. What this workflow refuses to do is the part
# that actually protects production:
#
#   · It never merges. `gh pr merge --auto` registers a merge that GitHub
#     executes only after the required checks pass. If CI is red, the PR sits
#     open and visibly red, and nothing is promoted.
#   · It only ever moves UP the ladder. dev→staging and staging→main are the
#     only edges; `main → dev` and `staging → dev` are reverts and are refused
#     loudly rather than silently undoing trunk.
#   · It never force-pushes and never merges a stale PR. If the target branch
#     moved after the PR was opened, the auto-merge is re-armed on the new head
#     only after CI re-runs on it.
#
# IF YOU WANT A HUMAN GATE ON MAIN: enable required review on the `main` branch
# in repo settings. Auto-merge then blocks until that review exists, and
# everything else here keeps working.
# ---------------------------------------------------------------------------
name: Promote

on:
  push:
    branches: [dev, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "evidence/**"
  # Re-arm after the ladder moves: merging dev→staging pushes to staging, which
  # is what opens the next PR. The push trigger covers it, and dispatch exists
  # so a stopped ladder can be restarted by hand.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Two promotions of the same edge must never race: the second would open a PR
# against a head the first one already moved past.
concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Open and arm the promotion PR
    runs-on: [self-hosted, securevoice-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit list under the PR is the whole point of a promotion, and a
          # shallow clone cannot produce it.
          fetch-depth: 0

      # The two legal edges are decided HERE, from the pushed branch, not taken
      # from an input. An input would let a hand-typed `main -> dev` reach the
      # step below, and that is a revert of trunk.
      - name: Resolve the promotion edge
        id: edge
        env:
          PUSHED: ${{ github.ref_name }}
        run: |
          case "$PUSHED" in
            dev)     source=dev;     target=staging ;;
            staging) source=staging; target=main ;;
            *)
              echo "::error::$PUSHED is not a promotion source. The ladder is dev -> staging -> main."
              exit 1
              ;;
          esac
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "### Promotion edge: ${source} -> ${target}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch both ends
        run: git fetch origin "${{ steps.edge.outputs.source }}" "${{ steps.edge.outputs.target }}"
        env:
          SOURCE: ${{ steps.edge.outputs.source }}
          TARGET: ${{ steps.edge.outputs.target }}

      # A promotion with nothing in it is not a no-op: it is a PR that says
      # "review this" about nothing, which is how review discipline dies. Say so
      # and stop.
      - name: Stop when there is nothing to promote
        id: delta
        env:
          SOURCE: ${{ steps.edge.outputs.source }}
          TARGET: ${{ steps.edge.outputs.target }}
        run: |
          count=$(git rev-list --count "origin/${TARGET}..origin/${SOURCE}")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "commits ahead of ${TARGET}: $count"
          if [ "$count" = "0" ]; then
            echo "${SOURCE} is already contained in ${TARGET} — nothing to promote." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or refresh the pull request, then arm auto-merge
        id: arm
        if: steps.delta.outputs.count != '0'
        env:
          # NOT secrets.GITHUB_TOKEN. A pull request opened with GITHUB_TOKEN is
          # treated as bot-authored, and GitHub then holds every workflow on it
          # for a maintainer to approve — which is exactly what happened: the CI
          # run on the first promotion PR sat at `action_required` with zero
          # jobs, so auto-merge could never arm and the ladder stalled waiting
          # for a human who was the thing auto-merge was meant to replace.
          #
          # A repo-scoped token creates the PR as the repository's own identity,
          # so CI runs on it immediately and auto-merge arms. Scope it to this
          # one repository with as little access as it will take.
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          SOURCE: ${{ steps.edge.outputs.source }}
          TARGET: ${{ steps.edge.outputs.target }}
          COUNT: ${{ steps.delta.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Without this, a failed `gh` call prints an error, leaves `pr` empty,
          # and the script carries on to "arm auto-merge" on nothing — so the
          # reported failure becomes "could not arm auto-merge" instead of the
          # real cause. The first run of this workflow failed exactly that way
          # and hid that GitHub Actions was not permitted to create PRs at all.
          set -euo pipefail

          # Reuse rather than stack: two open promotions of the same edge are two
          # reviews of the same diff, and the second one is always closed.
          existing=$(gh pr list --state open --base "$TARGET" --head "$SOURCE" \
            --json number --jq '.[0].number // empty')

          # The list is capped because a promotion that has drifted 100 commits is
          # evidence the ladder is not being walked often enough — the PR should
          # say so, not bury the reviewer in a 400-line body.
          log=$(git log --oneline --no-decorate -n 50 "origin/${TARGET}..origin/${SOURCE}" \
            | sed "s/^/- /")
          if [ "$COUNT" -gt 50 ]; then
            log="${log}
          - _… and $(( COUNT - 50 )) more; run \`git log --oneline origin/${TARGET}..origin/${SOURCE}\` for the rest_"
          fi

          # Squash, so the ladder records one reviewable change per promotion
          # instead of replaying dev's individual commits on staging and main.
          # The source branch keeps its own history either way.
          body=$(cat <<EOF
          ## Promotion: ${SOURCE} → ${TARGET}

          ${COUNT} commit(s) moving up the ladder. **This PR merges itself once CI is green.**

          ${log}

          ---
          Auto-merge is armed, so this lands without another press as soon as the
          required checks pass. To hold it, turn off auto-merge on this PR.

          What lands where:
          - \`${TARGET}\` = ${TARGET}
          - CI: [run ${RUN_URL}](${RUN_URL})

          Merging this promotes the code; it does not by itself ship a release.
          A release is a \`v*\` tag (see \`.github/workflows/release.yml\`), and the VPS
          deploy runs from \`main\` (see \`.github/workflows/deploy.yml\`).
          EOF
          )

          title="promote: ${SOURCE} -> ${TARGET} (${COUNT} commits)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            pr="$existing"
            echo "Refreshed existing PR #${pr}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base "$TARGET" --head "$SOURCE" --title "$title" --body "$body")
            pr=$(gh pr view "$url" --json number --jq '.number')
            echo "Opened promotion PR #${pr}: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # THIS IS THE WHOLE SAFETY MECHANISM: register, do not merge. GitHub
          # performs the merge only when every required check is green, and this
          # step reports failure rather than pretending the promotion happened if
          # auto-merge is unavailable (it must be enabled in repo settings).
          if gh pr merge "$pr" --squash --auto; then
            echo "Auto-merge armed on #${pr} — it lands when CI is green." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::could not arm auto-merge on #${pr}."
            echo "Enable \"Allow auto-merge\" in repo settings → Settings → General → Pull Requests,"
            echo "then re-run this workflow. The PR is open and will NOT merge on its own." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # The number is handed to the next step as an output: `run:` blocks get
          # their own shell, so a variable set here is otherwise invisible to the
          # step that has to clear a stale head.
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

          gh pr view "$pr" --json url --jq '.url' | tee -a "$GITHUB_STEP_SUMMARY" || true

      # ── Clear a stale head, or the rung silently never lands ─────────────────
      #
      # WHY THIS STEP EXISTS. main's branch rule requires the PR head to be up to
      # date, and `autoversion` cuts release bumps straight onto main. Every such
      # bump therefore leaves BOTH rungs behind: staging lacks the bump, dev lacks
      # what staging gained. Measured 2026-10-18: PR #134 sat with every required
      # check SUCCESS and mergeStateStatus BLOCKED for about three hours, and
      # `promote.yml` had already reported success — it opens the PR and arms
      # auto-merge, and neither of those things moves a stale head. "Armed but
      # BEHIND" is indistinguishable from "waiting for CI" unless somebody looks,
      # so the ladder looked broken when the automation was simply not finished.
      #
      # This is the part that was deliberately NOT automated until today. Merging
      # base into head is the operation that quietly deleted register sections
      # twice in one hour (f32083b lost §42; 851d531 lost §37-§41) — an append-only
      # log has no conflict to raise, so git takes the shorter copy and exits 0.
      # `checkAppendOnlyShrink` in scripts/drift-gates.mjs now fails the Drift gates
      # job when a merge reduces numbered sections against either parent, and that
      # job is a required check on this PR. Automating the update without the
      # fitness function first would have automated the data loss instead of the
      # promotion.
      #
      # Idempotent: on a head that is already current GitHub answers
      # "✓ PR branch already up-to-date" and nothing moves.
      - name: Update a stale head so auto-merge can actually land
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          TARGET: ${{ steps.edge.outputs.target }}
          PR_NUMBER: ${{ steps.arm.outputs.pr }}
        run: |
          set -euo pipefail

          # No PR, nothing to do: the "stop when there is nothing to promote" step
          # above already covered that case, and this step runs on every push.
          pr="${PR_NUMBER:-}"
          if [ -z "$pr" ]; then
            echo "no promotion PR this run (nothing to promote) — nothing to update"
            exit 0
          fi

          state=$(gh pr view "$pr" --json mergeStateStatus --jq '.mergeStateStatus')
          echo "mergeStateStatus before: $state"
          if [ "$state" != "BEHIND" ]; then
            echo "head is not BEHIND ${TARGET} — no update needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # FAIL LOUDLY, never quietly. Two causes, different remedies, and a
          # generic "promotion succeeded" line would hide both:
          #   · PROMOTE_TOKEN cannot push to the source branch (scope it contents:
          #     write, or the rung stays BEHIND forever and looks like CI latency);
          #   · a real conflict, which is a human decision and must not be resolved
          #     by a bot at 400 commits of drift.
          if ! gh pr update-branch "$pr"; then
            echo "::error::PR #${pr} is BEHIND ${TARGET} and could not be updated."
            echo "Either PROMOTE_TOKEN cannot push to the source branch, or base and head" \
                 "genuinely conflict — in which case a person must resolve it." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing is promoted by this run. The PR is open and NOT landing."
            exit 1
          fi

          after=$(gh pr view "$pr" --json mergeStateStatus --jq '.mergeStateStatus')
          echo "mergeStateStatus after: $after"
          echo "head was BEHIND ${TARGET}; updated it — now ${after}. Auto-merge lands it when the" \
               "required checks (including the append-only audit guard) pass." \
            >> "$GITHUB_STEP_SUMMARY"

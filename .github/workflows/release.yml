# ---------------------------------------------------------------------------
# SecureVoice AI — release
#
# Tag-driven. Push a semver tag and this builds the image, runs the smoke tests
# against it, publishes it to GHCR, and creates the GitHub release from the
# commit body.
#
# Version authority: the tag. package.json's "version" is kept in step by
# scripts/bump-version.mjs, which the release job verifies — so a tag that
# disagrees with package.json fails loudly instead of shipping a mislabelled image.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to GHCR

# cancel-in-progress: FALSE, deliberately. A release pushes an image, smoke-tests
# the published image, and creates a GitHub Release — interrupting one mid-flight
# can leave `:latest` pointing at an image that was never finished being built,
# or a Release page with no image behind it. Two concurrent releases for the same
# tag would race on the same tags for the same reason. These must queue, not
# cancel. (CI is the opposite: a superseded commit proves nothing, so it cancels.)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Publish image and release
    runs-on: [self-hosted, securevoice-vps]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Container repository names MUST be lowercase, and `github.repository` is
      # `BROCKUGANDA/SecureVoice-AI`. Using it verbatim produces
      # `ghcr.io/BROCKUGANDA/SecureVoice-AI`, which the registry rejects — the
      # push would fail on the first release, after the version bump and tag had
      # already landed. Derived once here and reused by the build, the smoke
      # test and the release body so all three name the same image.
      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Reject a tag that does not match package.json
        run: |
          tag="${GITHUB_REF_NAME}"                       # v0.3.0
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          [ "v$pkg" = "$tag" ] || {
            echo "::error::tag $tag does not match package.json version $pkg."
            echo "Run: bun run version:bump $pkg  and commit before tagging."
            exit 1
          }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THIS STEP IS THE FIX FOR THE FIRST RELEASE RUN (v0.2.1, tag push).
      #
      # `docker/build-push-action` drives BuildKit through the `docker buildx`
      # plugin, and a self-hosted runner with only the docker CLI has no builder
      # instance configured — the run died with `##[error]Docker buildx is
      # required.` before it built anything. This action creates the builder;
      # it is also what makes `provenance: true` and the SBOM below work at all.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args, because `bun run build` executes INSIDE this build and
          # every one of these is consumed at build time — a runtime .env cannot
          # substitute for any of them:
          #
          #  · BETTER_AUTH_SECRET — better-auth's import guard throws below 32
          #    chars and the Dockerfile deliberately ships no default, so the
          #    build dies without an arg. Disposable on purpose: this value
          #    would sit in the layer history of an image on a public registry,
          #    while the production secret arrives at RUNTIME through the
          #    container environment, which is where better-auth reads it.
          #
          #  · NEXT_PUBLIC_SITE_URL / NEXT_PUBLIC_PADDLE_PRICES /
          #    NEXT_PUBLIC_DEMO_LOGIN_* — NEXT_PUBLIC_* is inlined into the
          #    served bundle at build time (see the Dockerfile's ARG notes), so
          #    a value not passed here is not "unset at runtime", it is ABSENT
          #    from the JS. A missing price map makes `paddlePriceIds()` throw
          #    while prerendering /pricing, which kills this build; the price
          #    ids stay variables (public pricing is the product) but the demo
          #    credentials are repository SECRETS — `vars` are plaintext-readable
          #    by anyone with settings access, and the standing ask is that the
          #    demo credentials not be visible on the remote. The built bundle
          #    still contains them; that is the NEXT_PUBLIC_ contract, and the
          #    account is a throwaway demo-org owner for exactly that reason.
          #
          #    RE-APPLIED 2026-10-12: the first version of this change rode
          #    dev → staging → main and was then reverted by the v0.2.5 release
          #    branch's resync into main (the branch was cut before the change
          #    and carried the `vars` spelling; the merge took its side). Two
          #    files' worth of isolation fixes survived that same merge, which
          #    is what makes this one file the trap: check main, do not assume.
          build-args: |
            BETTER_AUTH_SECRET=ci-only-not-a-secret-ci-only-not-a-secret
            NEXT_PUBLIC_SITE_URL=https://securevoiceai.me
            NEXT_PUBLIC_PADDLE_PRICES=${{ vars.NEXT_PUBLIC_PADDLE_PRICES }}
            NEXT_PUBLIC_DEMO_LOGIN_EMAIL=${{ secrets.NEXT_PUBLIC_DEMO_LOGIN_EMAIL }}
            NEXT_PUBLIC_DEMO_LOGIN_PASSWORD=${{ secrets.NEXT_PUBLIC_DEMO_LOGIN_PASSWORD }}

      # ── the smoke test, and why it cannot be a plain `docker compose up` ──
      #
      # THIS RUNNER IS THE PRODUCTION VPS, and docker-compose.yml hardcodes
      # `name: securevoice-ai` — the live stack. A plain `docker compose up`
      # here resolves to the SAME project as production and would reconcile
      # against (i.e. replace) the live app, db and Caddy with test containers;
      # the teardown would then delete the production database volume. The
      # previous version of this job did exactly that and only survived because
      # the buildx failure above killed the run first.
      #
      # The mechanisms below are the ones ci.yml's compose-smoke job measured
      # out, mirrored wholesale so the two jobs cannot drift:
      #   · `-p svci-rel-<run>-<attempt>` — its own project, never production's;
      #   · per-run host ports — production holds 80/443 on this host, and two
      #     overlapping smoke runs must not fight over a fixed port either;
      #   · a throwaway .env — the app boots from `env_file: .env` and dies
      #     without BETTER_AUTH_SECRET, and BETTER_AUTH_URL must be the PUBLIC
      #     origin because src/lib/auth/origins.ts refuses a production boot on
      #     a loopback base URL (full story in ci.yml's compose-smoke job).
      - name: Allocate per-run ports and project name
        run: |
          set -euo pipefail
          rid=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          span=$(( rid % 4000 ))   # clamped: 60000+8999 overruns 65535 on some run ids
          HTTP=$(( 50000 + span + (attempt * 7) ))
          HTTPS=$(( 60000 + span + (attempt * 7) ))
          if [ "$HTTPS" -gt 65535 ] || [ "$HTTP" -gt 65535 ]; then
            echo "::error::allocated smoke ports exceed 65535 (http=$HTTP https=$HTTPS)"
            exit 1
          fi
          {
            echo "CI_CADDY_HTTP_PORT=$HTTP"
            echo "CI_CADDY_HTTPS_PORT=$HTTPS"
            echo "PROJECT=svci-rel-$rid-$attempt"
          } >> "$GITHUB_ENV"

      - name: Write the throwaway environment file
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=${{ env.PROJECT }}
          # Per-run app image tag — the same isolation ci.yml's smoke job carries.
          # `docker-compose.yml` names the app image `securevoice-ai-app:local`
          # by default, and any compose build on this host that leaves IMAGE
          # unset retags it, which is how production was left reconciling
          # against a stale test build. See ci.yml's env-file comment for the
          # measured history.
          IMAGE=${{ env.PROJECT }}-app:latest
          POSTGRES_USER=securevoice
          POSTGRES_PASSWORD=ci-only-not-a-secret
          POSTGRES_DB=securevoice
          BETTER_AUTH_SECRET=ci-only-not-a-secret-ci-only-not-a-secret
          BETTER_AUTH_URL=https://securevoiceai.me
          SITE_ADDRESS=localhost
          ACME_EMAIL=ci@example.invalid
          SEED_DEMO=false
          ELEVENLABS_DRY_RUN=true
          APP_ENV=staging
          NEXT_PUBLIC_PADDLE_PRICES='{"usd_9900_month":"pri_ciStarterMonth","usd_9900_year":"pri_ciStarterYear","usd_49900_month":"pri_ciGrowthMonth","usd_49900_year":"pri_ciGrowthYear","usd_200000_month":"pri_ciEnterpriseMonth","usd_200000_year":"pri_ciEnterpriseYear"}'
          DATABASE_URL=postgresql://securevoice:ci-only-not-a-secret@db:5432/securevoice?schema=public
          ENV
          echo "wrote a throwaway .env for the release smoke"

      # The from-source half of the topology. `app` is deliberately ABSENT: the
      # artifact under test is the image just pushed to GHCR, which the next
      # step pulls exactly as a consumer would.
      - name: Build the from-source services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" build db-setup realtime

      - name: Smoke test the published image through Caddy
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" pull app
          # Only the services on the /api/health path. Naming them keeps the
          # worker images (nothing published those) out of an --no-build start.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" \
            up -d --no-build --wait --wait-timeout 300 db db-setup redis realtime app caddy
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" ps
          for _ in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost:${CI_CADDY_HTTPS_PORT}"/api/health || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "api/health via Caddy: $code"
          test "$code" = "200"
        env:
          # The pulled tag. Must be the SAME lowercased name the build pushed,
          # or compose looks for an image that was never published.
          IMAGE: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Report status
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" ps

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" logs --no-color --tail 200

      # Same assertion as ci.yml: isolation is a claim until it is observed.
      # Read the label off the containers themselves rather than asking compose
      # to enumerate a project: this runs in the runner's throwaway checkout,
      # whose compose file is not what answers "is production still up?".
      - name: Production stack untouched
        if: always()
        run: |
          up=$(docker ps --filter "label=com.docker.compose.project=securevoice-ai" \
                 --filter status=running --format '{{.Names}}' | wc -l)
          echo "production containers running: $up"
          if [ "$up" -lt 7 ]; then
            echo "::error::production has $up/7 containers running — a smoke-test job disturbed it"
            exit 1
          fi
          # Retry loop, same shape as ci.yml's and for the same measured
          # reason — with one more on this side: a tag is cut seconds after
          # the bump lands on main, so this probe can run while Deploy is
          # rolling the app on the same host, and a healthy origin answers
          # 503 for a few seconds mid-recreate. Six attempts over ~a minute
          # keeps the gate honest (a down origin fails all of them) without
          # failing a release the box was never asked to survive.
          code=""
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              https://securevoiceai.me/api/health || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "production api/health: $code"
          [ "$code" = "200" ] || { echo "::error::production origin is not healthy"; exit 1; }

      # Must name the SAME per-run project the smoke created ($PROJECT). A bare
      # `docker compose down -v` resolves to `securevoice-ai` and would delete
      # the PRODUCTION database volume.
      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml -p "$PROJECT" down -v --remove-orphans || true
          rm -f .env

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            Run the full stack (Postgres, app, realtime, Caddy with TLS):

            ```bash
            SITE_ADDRESS=your.domain ACME_EMAIL=you@example.com \
              REALTIME_INGEST_SECRET="$(openssl rand -base64 32)" \
              docker compose up -d
            ```

            `app` and `realtime` stay on the internal network; Caddy is the only
            published port.

            Verified in CI on this tag: lint, typecheck (app + realtime), 48 realtime
            tests, production build, `caddy validate` on both configs, compose parse,
            and a live stack smoke test through Caddy over TLS.

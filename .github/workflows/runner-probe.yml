name: Runner probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Can a runner take a job at all
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Echo
        run: |
          echo "runner reached the job"
          echo "uname: $(uname -a)"
          docker --version || echo "no docker cli"

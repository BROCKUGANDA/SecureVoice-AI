pipeline:
  name: run
  identifier: run
  description: Build, lint, and test the SecureVoice-AI TypeScript codebase on Harness Cloud.
  projectIdentifier: default_project
  orgIdentifier: default
  tags:
    ai_generated: ""
  properties:
    ci:
      codebase:
        connectorRef: account.securevoiceai
        repoName: SecureVoice-AI
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: Install dependencies, type-check, build, and test.
        type: CI
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            paths:
              - node_modules
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    image: node:20
                    command: npm install
              - step:
                  type: Run
                  name: Type Check
                  identifier: Type_Check
                  spec:
                    image: node:20
                    command: npx tsc --noEmit
              - step:
                  type: Run
                  name: Build
                  identifier: Build
                  spec:
                    image: node:20
                    command: npm run build --if-present
              - step:
                  type: Run
                  name: Test
                  identifier: Test
                  spec:
                    image: node:20
                    command: npm test --if-present

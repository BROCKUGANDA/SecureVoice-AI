# ---------------------------------------------------------------------------
# SecureVoice AI — one-command reproducible demo
#
#   docker compose up --build          → http://localhost:3000
#
# What happens:
#   1. db  — Postgres 16 comes up on the compose network. The datasource in
#      prisma/schema.prisma is `postgresql` and Prisma REJECTS a `file:` URL
#      outright (P1012), so Postgres is the only supported mode — this is what
#      makes `docker compose up --build` genuinely reproducible.
#   2. db-setup waits for it healthy, runs `prisma db push`, then seeds a
#      realistic intervention case history so the Command Center isn't empty.
#   3. app serves the Next.js standalone bundle on port 3000.
#
# To use your OWN Postgres instead of the bundled one, pass a connection
# string via DATABASE_URL and start only the two app services:
#   docker compose up --build db-setup app
#
# Secrets: app loads an optional local .env (ElevenLabs / Twilio / webhook
# keys). Without one the platform boots in audit-only / dry-run mode —
# everything works, nothing is dialed, no quota is burned. Safe for judges.
#
# The database lives in the named volume `db-data` and survives restarts;
# wipe it with `docker compose down -v` for a factory-fresh demo.
# ---------------------------------------------------------------------------
name: securevoice-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: securevoice
      POSTGRES_PASSWORD: securevoice
      POSTGRES_DB: securevoice
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securevoice -d securevoice"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-setup:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://securevoice:securevoice@db:5432/securevoice?schema=public}
    volumes:
      - db-data:/app/db
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: "no"
    command: ["sh", "-c", "bunx prisma db push --accept-data-loss --skip-generate && bun scripts/seed-demo.mjs"]

  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://securevoice:securevoice@db:5432/securevoice?schema=public}
    env_file:
      - path: .env
        required: false
    volumes:
      - db-data:/app/db
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db-data:

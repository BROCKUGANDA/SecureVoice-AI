# ---------------------------------------------------------------------------
# SecureVoice AI — one-command reproducible demo
#
#   docker compose up --build          → https://localhost (via Caddy)
#   docker compose --profile direct up --build   → http://localhost:3000
#
# What happens:
#   1. db  — Postgres 16 comes up on the compose network. The datasource in
#      prisma/schema.prisma is `postgresql` and Prisma REJECTS a `file:` URL
#      outright (P1012), so Postgres is the only supported mode — this is what
#      makes `docker compose up --build` genuinely reproducible.
#   2. db-setup waits for it healthy, runs `prisma migrate deploy` (versioned
#      SQL in prisma/migrations — never `db push --accept-data-loss` on a real
#      deployment), then seeds a demo case history (SEED_DEMO=false to skip).
#   3. realtime  — the Command Center's push path (Bun + socket.io). Holds a
#      signing secret but NO database client: it only moves already-redacted,
#      already-authorised events to sockets.
#   4. app serves the Next.js standalone bundle on port 3000.
#   5. caddy is the ONLY service that publishes a port, and terminates TLS.
#
# Two access paths, and why both exist:
#   • Default (`caddy` service): the real topology. :80/:443 → caddy → app+realtime.
#     Nothing else is reachable from outside, which is what makes the trust
#     model in src/proxy.ts sound.
#   • `--profile direct`: publishes app's :3000 straight to the host for quick
#     local work. Convenient, but then the origin IS internet-reachable if the
#     host is — and every X-Forwarded-For header becomes forgeable, so the edge
#     layer falls back to a single shared rate-limit bucket. Fine for a laptop;
#     do not ship it.
#
# To use your OWN Postgres instead of the bundled one, set POSTGRES_USER /
# POSTGRES_PASSWORD / POSTGRES_DB plus a full DATABASE_URL in .env and start
# only the app services against it:
#   docker compose up --build app realtime caddy
#
# Secrets: app loads an optional local .env (ElevenLabs / Twilio / webhook
# keys). Without one the platform boots in audit-only / dry-run mode —
# everything works, nothing is dialed, no quota is burned. Safe for judges.
# Realtime is also optional: with no REALTIME_INGEST_SECRET the service starts
# but refuses every connection, /api/console/realtime-token returns 503, and the
# console falls back to its SSE feed. Nothing breaks.
#
# The database lives in the named volume `db-data` and survives restarts;
# wipe it with `docker compose down -v` for a factory-fresh demo.
# ---------------------------------------------------------------------------
name: securevoice-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      # Credentials interpolate from .env (Compose auto-loads it for
      # interpolation). Defaults keep the zero-config demo bootable; a public
      # deployment MUST set POSTGRES_PASSWORD in .env.
      POSTGRES_USER: ${POSTGRES_USER:-securevoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securevoice}
      POSTGRES_DB: ${POSTGRES_DB:-securevoice}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-setup:
    build:
      context: .
      target: builder
      args:
        # Inlined into the Next.js bundle at build time — see Dockerfile.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    logging: *default-logging
    environment:
      # Built from PARTS, not interpolated as a whole: a stray DATABASE_URL in a
      # developer's .env (e.g. a remote Supabase host) must not redirect the
      # schema push away from the bundled Postgres. Rotate the parts via
      # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD:-securevoice}@db:5432/${POSTGRES_DB:-securevoice}?schema=public
      # Seed the demo case history on first boot. Idempotent per callRef; set
      # SEED_DEMO=false in .env for a clean production database.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    # Retry on transient failure — `restart: "no"` made a single failed push an
    # unrecoverable gate (app requires service_completed_successfully).
    restart: on-failure:3
    command: ["sh", "-c", "bunx prisma migrate deploy && if [ \"$SEED_DEMO\" = \"true\" ]; then bun scripts/seed-demo.mjs; fi"]

  # Command Center push path. Separate image, separate trust boundary, and
  # independently restartable: a hung socket layer must never take the API with it.
  realtime:
    build:
      # Its own context — different dependency tree (socket.io, no Prisma, no Next).
      context: ./mini-services/realtime
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      # Shared signing secret, dedicated to the realtime path. It deliberately
      # does NOT fall back to AGENT_TOOL_SECRET: that secret crosses the wire on
      # ElevenLabs tool calls, and reusing it would let a leak there forge
      # console broadcasts and mint realtime grants.
      REALTIME_INGEST_SECRET: ${REALTIME_INGEST_SECRET:-}
      # Comma-separated allowed browser origins. Defaults to the public site;
      # set explicitly to "" only for local dev (accept-any is a hijack surface).
      REALTIME_ALLOWED_ORIGIN: ${REALTIME_ALLOWED_ORIGIN:-https://${SITE_ADDRESS:-localhost}}
    expose:
      - "4000"
    healthcheck:
      # Liveness, not readiness: /readyz 503s until a signing secret is set, and a
      # healthcheck that fails on a fresh clone would restart-loop forever.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      target: runner
      args:
        # Inlined into the Next.js bundle at build time — see Dockerfile.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    # IMAGE lets a release job smoke-test the image it just published instead of a
    # locally rebuilt copy. Unset (the normal case) => build from source.
    # `${VAR:-}` with no value yields an empty string, and compose treats that as
    # "no image override", so the default build path is unchanged.
    image: ${IMAGE:-securevoice-ai-app:local}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      HOSTNAME: 0.0.0.0
      # Built from parts — see db-setup for why a whole-URL interpolation is unsafe.
      DATABASE_URL: postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD:-securevoice}@db:5432/${POSTGRES_DB:-securevoice}?schema=public
      # Internal service name, NEVER localhost: inside the app container,
      # localhost is the app container. Empty = realtime disabled, console uses SSE.
      REALTIME_URL: ${REALTIME_URL:-http://realtime:4000}
      REALTIME_INGEST_SECRET: ${REALTIME_INGEST_SECRET:-}
    env_file:
      - path: .env
        required: false
    expose:
      - "3000"
    depends_on:
      db-setup:
        condition: service_completed_successfully
      realtime:
        condition: service_started
    healthcheck:
      # Readiness, not liveness: the instance must be able to reach its
      # database before it is allowed to take traffic. /api/health stays a pure
      # process probe for uptime monitors.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Reverse proxy — the only published port. TLS via Let's Encrypt; certificates
  # and config persist in named volumes so a restart does not re-issue.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Domain to issue a certificate for. Must resolve to this host.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates + ACME account
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      realtime:
        condition: service_started
    healthcheck:
      # Probe the edge itself. Must NOT depend on the ACME cert: before (and
      # during) issuance, :80 answers with a 308→https redirect, so accept any
      # HTTP response line as proof Caddy is serving. (The previous check hit
      # the admin API on :2019, which `admin off` disables — never healthy.)
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1/healthz 2>&1 | grep -qE 'HTTP/1\\.[01] (200|301|302|307|308)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Opt-in escape hatch for local work: publish the app's :3000 directly and skip
  # TLS. Off by default — see the note at the top of this file.
  app-direct:
    profiles: ["direct"]
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    logging: *default-logging
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD:-securevoice}@db:5432/${POSTGRES_DB:-securevoice}?schema=public
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      db-setup:
        condition: service_completed_successfully

volumes:
  db-data:
  caddy-data:
  caddy-config:

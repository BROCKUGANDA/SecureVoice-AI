# ---------------------------------------------------------------------------
# SecureVoice AI â€” one-command reproducible demo
#
#   docker compose up --build          â†’ https://localhost (via Caddy)
#   docker compose --profile direct up --build   â†’ http://localhost:3000
#
# What happens:
#   1. db  â€” Postgres 16 comes up on the compose network. The datasource in
#      prisma/schema.prisma is `postgresql` and Prisma REJECTS a `file:` URL
#      outright (P1012), so Postgres is the only supported mode â€” this is what
#      makes `docker compose up --build` genuinely reproducible.
#   2. db-setup waits for it healthy, runs `prisma migrate deploy` (versioned
#      SQL in prisma/migrations â€” never `db push --accept-data-loss` on a real
#      deployment), then seeds a demo case history (SEED_DEMO=false to skip).
#   3. realtime  â€” the Command Center's push path (Bun + socket.io). Holds a
#      signing secret but NO database client: it only moves already-redacted,
#      already-authorised events to sockets.
#   4. app serves the Next.js standalone bundle on port 3000.
#   5. caddy is the ONLY service that publishes a port, and terminates TLS.
#
# Two access paths, and why both exist:
#   â€¢ Default (`caddy` service): the real topology. :80/:443 â†’ caddy â†’ app+realtime.
#     Nothing else is reachable from outside, which is what makes the trust
#     model in src/proxy.ts sound.
#   â€¢ `--profile direct`: publishes app's :3000 straight to the host for quick
#     local work. Convenient, but then the origin IS internet-reachable if the
#     host is â€” and every X-Forwarded-For header becomes forgeable, so the edge
#     layer falls back to a single shared rate-limit bucket. Fine for a laptop;
#     do not ship it.
#
# To use your OWN Postgres instead of the bundled one, set POSTGRES_USER /
# POSTGRES_PASSWORD / POSTGRES_DB plus a full DATABASE_URL in .env and start
# only the app services against it:
#   docker compose up --build app realtime caddy
#
# Secrets: app loads an optional local .env (ElevenLabs / Twilio / webhook
# keys). Without one the platform boots in audit-only / dry-run mode â€”
# everything works, nothing is dialed, no quota is burned. Safe for judges.
# Realtime is also optional: with no REALTIME_INGEST_SECRET the service starts
# but refuses every connection, /api/console/realtime-token returns 503, and the
# console falls back to its SSE feed. Nothing breaks.
#
# The database lives in the named volume `db-data` and survives restarts;
# wipe it with `docker compose down -v` for a factory-fresh demo.
# ---------------------------------------------------------------------------
name: securevoice-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      # Credentials interpolate from .env (Compose auto-loads it for
      # interpolation). POSTGRES_PASSWORD is REQUIRED with no default: a known
      # fallback password on a public deployment is a compromised database, and
      # the volume bakes the role password at first boot (see .env.example).
      POSTGRES_USER: ${POSTGRES_USER:-securevoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-securevoice}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-setup:
    build:
      context: .
      target: builder
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        # Demo shortcut credentials. NEXT_PUBLIC_* is inlined at BUILD time, so
        # omitting these does not merely hide the one-click judge login from
        # src/views/Auth.tsx — it compiles the button out of the bundle. Every
        # service built from this Dockerfile runs the builder stage (which ends
        # in `bun run build`), so every one of them needs the pair.
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
    logging: *default-logging
    environment:
      # Use the same DATABASE_URL as the rest of the stack — .env is the single
      # source of truth, all containers hit the same Postgres (Supabase).
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
      # The compose database is a container on a private network with no server
      # certificate; see dial-worker for why the acknowledgement lives here.
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      # Seed the demo case history on first boot. Idempotent per callRef; set
      # SEED_DEMO=false in .env for a clean production database.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    # Retry on transient failure â€” `restart: "no"` made a single failed push an
    # unrecoverable gate (app requires service_completed_successfully).
    restart: on-failure:3
    command: ["sh", "-c", "bunx prisma migrate deploy && if [ \"$SEED_DEMO\" = \"true\" ]; then bun scripts/seed-demo.mjs; fi"]

  # Dial worker (S-1). Places the calls the ingest handler queued. A separate
  # service, not a thread in the app: a hung carrier call must never occupy a
  # web request, and killing the web tier must not stop fraud interventions.
  # Scaling is safe by construction â€” claiming uses FOR UPDATE SKIP LOCKED â€” so
  # `--scale dial-worker=3` needs no coordination between replicas.
  dial-worker:
    user: "1000:1000"   # non-root
    build:
      context: .
      target: builder   # full source tree: the worker is a script, not a bundle
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        # Demo shortcut credentials. NEXT_PUBLIC_* is inlined at BUILD time, so
        # omitting these does not merely hide the one-click judge login from
        # src/views/Auth.tsx — it compiles the button out of the bundle. Every
        # service built from this Dockerfile runs the builder stage (which ends
        # in `bun run build`), so every one of them needs the pair.
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
      # Durable ElevenLabs character meter. Defaults to the compose redis
      # service; unset it and the guard falls back to per-process counting,
      # which it logs as degraded rather than hiding.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: production
      # The compose database is a container on a private network with no server
      # certificate. src/lib/db.ts refuses a plaintext connection in production
      # without this explicit acknowledgement, so it is stated here rather than
      # weakened globally.
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      REQUIRE_VPS_DATABASE: ${REQUIRE_VPS_DATABASE:-false}
      # Per-case envelope encryption (WP-15). Unset in compose means the ingest
      # stores no evidence payload at all — set PRIVACY_MASTER_KEY in .env to
      # enable sealed transcripts. Never defaulted: see .env.example.
      PRIVACY_MASTER_KEY: ${PRIVACY_MASTER_KEY:-}
      ELEVENLABS_DRY_RUN: ${ELEVENLABS_DRY_RUN:-true}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      ELEVENLABS_PHONE_NUMBER_ID: ${ELEVENLABS_PHONE_NUMBER_ID:-}
      ELEVENLABS_VOICE_EN: ${ELEVENLABS_VOICE_EN:-}
      ELEVENLABS_VOICE_AR: ${ELEVENLABS_VOICE_AR:-}
      ELEVENLABS_VOICE_HI: ${ELEVENLABS_VOICE_HI:-}
      ELEVENLABS_VOICE_UR: ${ELEVENLABS_VOICE_UR:-}
      ELEVENLABS_VOICE_FR: ${ELEVENLABS_VOICE_FR:-}
      ELEVENLABS_VOICE_SW: ${ELEVENLABS_VOICE_SW:-}
      # Where the voice-stream worker lives on the compose network. The dial
      # worker POSTs /prewarm here at the DIALING state, before the customer
      # answers, so the call's fixed phrases are already synthesised and a
      # Deepgram socket is already open. Fire-and-forget: a warm-up that can
      # fail a dial would be disabled, and a cold first call is not a failed
      # dial. Same optional secret as the voice-stream worker.
      VOICE_STREAM_INTERNAL_URL: ${VOICE_STREAM_INTERNAL_URL:-http://voice-stream-worker:8080}
      VOICE_PREWARM_SECRET: ${VOICE_PREWARM_SECRET:-}
      # The PUBLIC hostname the carrier dials back for the media stream
      # (wss://<SITE_ADDRESS>/realtime/media-stream). Unlike VOICE_STREAM_INTERNAL_URL
      # this is not an internal address — Twilio resolves it from the internet —
      # so it is passed through un-defaulted: `src/worker/dial.ts` refuses to
      # start (flag on) or to dial (flag on mid-process) with an empty or
      # loopback value, because a URL the carrier cannot reach is a recorded
      # successful dial the customer hears silence on.
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      # The dial worker is where this flag is actually READ (src/worker/dial.ts
      # chooses ConvAI vs the media-streams pipeline in-process). Only
      # voice-stream-worker used to receive it, so flipping the flag moved the
      # stream worker and left the dialer on the old path — a split-brain with
      # no error anywhere. Both services now get the same value.
      FEATURE_TWILIO_MEDIA_STREAMS: ${FEATURE_TWILIO_MEDIA_STREAMS:-false}
      DIAL_WORKER_POLL_MS: ${DIAL_WORKER_POLL_MS:-1000}
      DIAL_WORKER_BATCH: ${DIAL_WORKER_BATCH:-5}
    depends_on:
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # The preload neutralises the Next-only `server-only` marker for this plain Bun
    # process; see scripts/worker-preload.ts for why that is safe. --smol trades a
    # little throughput for a measurably smaller heap (docs/CAPACITY.md §10) — the
    # right trade for a polled worker inside a 512m box.
    command: ["bun", "--smol", "--preload", "./scripts/worker-preload.ts", "src/worker/dial.ts"]

  # Email outbox worker. Retries transactional auth mail (magic link, invite,
  # password reset) that a synchronous send could not deliver.
  #
  # The request path already attempts one immediate send, so this worker is not
  # needed on the happy path — it exists so a transient Resend outage does not
  # cost an analyst their sign-in link into a fraud console. Without it the
  # durable queue in src/lib/email/outbox.ts is decorative: rows would sit
  # PENDING forever.
  #
  # SCALE IT FREELY. Claims use FOR UPDATE SKIP LOCKED plus a compare-and-set,
  # so `--scale email-worker=2` delivers each message exactly once.
  email-worker:
    user: "1000:1000"   # non-root
    build:
      context: .
      target: builder
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: production
      # Same explicit acknowledgement as the other workers: the compose db is a
      # container on a private network with no server certificate.
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      REQUIRE_VPS_DATABASE: ${REQUIRE_VPS_DATABASE:-false}
      # The provider credentials. Unset, the worker boots and simply has nothing
      # to send — it does not crash-loop, so a deployment that has not configured
      # email yet still starts cleanly.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-SecureVoice AI <onboarding@resend.dev>}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      # Link origin used when a queued message is re-rendered at send time.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Poll interval for the drain loop.
      EMAIL_WORKER_POLL_MS: ${EMAIL_WORKER_POLL_MS:-10000}
      EMAIL_WORKER_BATCH: ${EMAIL_WORKER_BATCH:-25}
    depends_on:
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["bun", "--smol", "--preload", "./scripts/worker-preload.ts", "scripts/email-worker.ts", "--loop"]

  # Retention sweeper. The privacy tiers (audio purge, payload-key shred,
  # case-record delete) erase on the clock whether or not anyone remembers —
  # that is the point of the policy, so it runs as a service and not a cron
  # note. First sweep at boot (a worker that was down owes the backlog a
  # sweep), then every RETENTION_SWEEP_HOURS. `--once` for operators.
  retention-worker:
    user: "1000:1000"   # non-root
    build:
      context: .
      target: builder   # full source tree: the worker is a script, not a bundle
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        # Demo shortcut credentials. NEXT_PUBLIC_* is inlined at BUILD time, so
        # omitting these does not merely hide the one-click judge login from
        # src/views/Auth.tsx — it compiles the button out of the bundle. Every
        # service built from this Dockerfile runs the builder stage (which ends
        # in `bun run build`), so every one of them needs the pair.
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
      NODE_ENV: production
      # The compose database is a container on a private network with no server
      # certificate; see dial-worker for why the acknowledgement lives here.
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      REQUIRE_VPS_DATABASE: ${REQUIRE_VPS_DATABASE:-false}
      RETENTION_SWEEP_HOURS: ${RETENTION_SWEEP_HOURS:-24}
      # The object store, so the 30-day audio tier can delete what the app stored.
      #
      # This service declares no `env_file` (the app does, and it is the app's
      # webhook that archives a recording), so without these five lines the worker
      # boots, reports `audioStore: "none-configured"`, and leaves every MP3 in the
      # bucket past the deadline the policy names — while the report's `due` count
      # looks like a tier that ran. The adapter is
      # `src/lib/storage/retention-audio-store.ts`; the wiring is this block, and
      # neither half works alone.
      #
      # No default for the region, deliberately: `resolveStorageConfig()` requires
      # it explicitly because a silently wrong region produces a
      # SignatureDoesNotMatch at the far end that nobody can read, and a compose
      # default would reintroduce exactly that. Empty here reads as "no store
      # configured", which is the honest posture for a deployment that archives no
      # audio — the worker logs it and deletes nothing.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    # --smol: measured heap trade, see docs/CAPACITY.md §10 (256m box, idle sweeper).
    command: ["bun", "--smol", "--preload", "./scripts/worker-preload.ts", "src/worker/retention.ts"]

  # Overage billing worker. Rates each tenant's most recently CLOSED subscription
  # period against ITS plan (Starter 15¢, Growth 12¢) and raises a manual-
  # collection invoice — a Net-30 document, never an automatic charge, because a
  # Merchant of Record holds no card authorization to charge later.
  #
  # It writes NOTHING until `OVERAGE_INVOICING_ENABLED=1`. With the switch unset
  # every tenant is rated and reported as `would_bill`, which is how a deployment
  # checks the arithmetic against a real closed period before any of it reaches a
  # bank's accounts team. The live-money guard is not duplicated here: the Paddle
  # adapter itself refuses a `pdl_live_` key unless `PADDLE_ALLOW_LIVE_KEYS=1`.
  #
  # A service rather than a cron note, for the same reason as the sweeper above:
  # a period closes whether or not anyone remembers to bill it.
  overage-worker:
    user: "1000:1000"   # non-root
    build:
      context: .
      target: builder   # full source tree: the worker is a script, not a bundle
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
      NODE_ENV: production
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      REQUIRE_VPS_DATABASE: ${REQUIRE_VPS_DATABASE:-false}
      OVERAGE_SWEEP_HOURS: ${OVERAGE_SWEEP_HOURS:-24}
      # Deliberately defaults OFF. Setting this to 1 is the decision to send
      # invoices to customers, and it should not be a side effect of a deploy.
      OVERAGE_INVOICING_ENABLED: ${OVERAGE_INVOICING_ENABLED:-false}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICES: ${PADDLE_PRICES:-}
      PADDLE_ALLOW_LIVE_KEYS: ${PADDLE_ALLOW_LIVE_KEYS:-}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-AED}
      INCLUDED_UNITS_PER_PERIOD: ${INCLUDED_UNITS_PER_PERIOD:-}
      OVERAGE_RATE_MINOR_PER_UNIT: ${OVERAGE_RATE_MINOR_PER_UNIT:-}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    command: ["bun", "--smol", "--preload", "./scripts/worker-preload.ts", "src/worker/overage.ts"]

  # LiteLLM proxy (optional). Provider precedence is GROQ_API_KEY >
  # LITELLM_API_KEY > GEMINI_API_KEY — the first configured one wins, so with
  # none of them set the agent speaks the vetted scripted reply and the demo
  # works unchanged.
  #
  # This is the recommended production path, and it exists for two reasons that
  # are not preferences:
  #   · voice turns are latency-budgeted at ~2s, and
  #   · customer transcripts are bank-customer PII, which should stay inside
  #     this deployment's boundary rather than a third party that trains on it.
  #
  # `main-lite` is the slim image — it carries the proxy and the model registry,
  # not every provider SDK. Point LITELLM_MODEL at whatever the proxy serves;
  # the default (llama-3.3-70b-instruct) is permissively licensed and covers the
  # languages this agent speaks (ar, hi, ur, fr, sw).
  #
  # No upstream provider is configured here on purpose: this service is inert
  # until LITELLM_API_KEY is set in .env AND a model is registered on the proxy.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      # The proxy's own auth key. This is the value a caller presents as a
      # bearer token, so it is NOT a secret the proxy needs to be told twice —
      # GENERATE_KEYS=false plus an explicit LITELLM_API_KEY keeps one source of
      # truth, and the same value works whether the caller is this app or a
      # developer's curl.
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      GENERATE_KEYS: "false"
      STORE_MODEL_IN_DB: "false"
      # No telemetry: this deployment carries bank-customer PII and the proxy
      # must not be a reason it leaves the boundary.
      LITELLM_TELEMETRY: "false"
    expose:
      - "4000"

  # Voice stream worker (Twilio Media Streams + Deepgram + ElevenLabs).
  # Serves the WebSocket endpoint Twilio connects to for live-call audio.
  voice-stream-worker:
    user: "1000:1000"   # non-root
    # Must exceed SHUTDOWN_DRAIN_MS (65s, src/lib/graceful-shutdown.ts) or the
    # drain is decoration: Docker sends SIGKILL at its 10s default while a
    # customer is mid-sentence. tests/unit/shutdown-window.test.ts enforces the
    # relationship, so this cannot silently stop being true.
    stop_grace_period: 75s
    build:
      context: .
      target: builder
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        # Demo shortcut credentials. NEXT_PUBLIC_* is inlined at BUILD time, so
        # omitting these does not merely hide the one-click judge login from
        # src/views/Auth.tsx — it compiles the button out of the bundle. Every
        # service built from this Dockerfile runs the builder stage (which ends
        # in `bun run build`), so every one of them needs the pair.
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
      NODE_ENV: production
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      REQUIRE_VPS_DATABASE: ${REQUIRE_VPS_DATABASE:-false}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_multilingual_v2}
      VOICE_STREAM_HOST: ${VOICE_STREAM_HOST:-0.0.0.0}
      VOICE_STREAM_PORT: ${VOICE_STREAM_PORT:-8080}
      # Optional shared secret for the internal /prewarm endpoint. Unset means
      # the compose-internal port alone guards it (it is `expose`d, never
      # published); set the same value in both services to require the header.
      VOICE_PREWARM_SECRET: ${VOICE_PREWARM_SECRET:-}
      FEATURE_TWILIO_MEDIA_STREAMS: ${FEATURE_TWILIO_MEDIA_STREAMS:-false}
      # Per-language voices. EVERY supported language needs one: the worker
      # resolves the voice from the call's language, and an unresolvable voice id
      # fails synthesis — silence on a fraud call. `ur` in particular is not
      # optional: the Governed Collections brief names Urdu, and a missing
      # ELEVENLABS_VOICE_UR means the Urdu path is dead while every English test
      # still passes.
      ELEVENLABS_VOICE_EN: ${ELEVENLABS_VOICE_EN:-}
      ELEVENLABS_VOICE_AR: ${ELEVENLABS_VOICE_AR:-}
      ELEVENLABS_VOICE_HI: ${ELEVENLABS_VOICE_HI:-}
      ELEVENLABS_VOICE_UR: ${ELEVENLABS_VOICE_UR:-}
      ELEVENLABS_VOICE_FR: ${ELEVENLABS_VOICE_FR:-}
      ELEVENLABS_VOICE_SW: ${ELEVENLABS_VOICE_SW:-}
      # LiteLLM proxy, by service name. Empty LITELLM_API_KEY is what makes the
      # provider selection fall through to Gemini or to the scripted reply.
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-llama-3.3-70b-instruct}
      LITELLM_TIMEOUT_MS: ${LITELLM_TIMEOUT_MS:-8000}
    expose:
      - "8080"
    depends_on:
      db-setup:
        condition: service_completed_successfully
    command: ["bun", "--smol", "--preload", "./scripts/worker-preload.ts", "src/worker/voice-stream.ts"]

  # Outbox worker — drains signed bank/operator webhook deliveries from Postgres.
  # This is the only place that does network I/O for outbound events; request
  # handlers never await fetch directly.
  outbox-worker:
    user: "1000:1000"   # non-root
    build:
      context: .
      target: builder
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        # Demo shortcut credentials. NEXT_PUBLIC_* is inlined at BUILD time, so
        # omitting these does not merely hide the one-click judge login from
        # src/views/Auth.tsx — it compiles the button out of the bundle. Every
        # service built from this Dockerfile runs the builder stage (which ends
        # in `bun run build`), so every one of them needs the pair.
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
      NODE_ENV: production
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      REQUIRE_VPS_DATABASE: ${REQUIRE_VPS_DATABASE:-false}
      OUTBOX_DELIVERY_TIMEOUT_MS: ${OUTBOX_DELIVERY_TIMEOUT_MS:-10000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-6}
      BANK_WEBHOOK_URL: ${BANK_WEBHOOK_URL:-}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    command: ["bun", "--smol", "--preload", "./scripts/worker-preload.ts", "scripts/outbox-worker.ts", "--loop", "10"]

  # Command Center push path. Separate image, separate trust boundary, and
  # independently restartable: a hung socket layer must never take the API with it.
  realtime:
    build:
      # Its own context â€” different dependency tree (socket.io, no Prisma, no Next).
      context: ./mini-services/realtime
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      # Shared signing secret, dedicated to the realtime path. It deliberately
      # does NOT fall back to AGENT_TOOL_SECRET: that secret crosses the wire on
      # ElevenLabs tool calls, and reusing it would let a leak there forge
      # console broadcasts and mint realtime grants.
      REALTIME_INGEST_SECRET: ${REALTIME_INGEST_SECRET:-}
      # Comma-separated allowed browser origins. Defaults to the public site;
      # set explicitly to "" only for local dev (accept-any is a hijack surface).
      REALTIME_ALLOWED_ORIGIN: ${REALTIME_ALLOWED_ORIGIN:-https://${SITE_ADDRESS:-localhost}}
    expose:
      - "4000"
    healthcheck:
      # Liveness, not readiness: /readyz 503s until a signing secret is set, and a
      # healthcheck that fails on a fresh clone would restart-loop forever.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      target: runner
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        # Demo shortcut credentials. NEXT_PUBLIC_* is inlined at BUILD time, so
        # omitting these does not merely hide the one-click judge login from
        # src/views/Auth.tsx — it compiles the button out of the bundle. Every
        # service built from this Dockerfile runs the builder stage (which ends
        # in `bun run build`), so every one of them needs the pair.
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
        # Canonical public origin, inlined at BUILD time like the pair above.
        # Defaults to https://<SITE_ADDRESS> — the same hostname Caddy issues
        # the certificate for — so a deployment that already set SITE_ADDRESS
        # for TLS gets a correct canonical URL and sitemap without a second
        # variable to remember. Set NEXT_PUBLIC_SITE_URL explicitly to override.
        #
        # Why it must be here and not in `environment:` below: `environment:`
        # applies at RUNTIME, and by then `next build` has already frozen the
        # value into the bundle. A runtime-only setting is silently ignored.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${SITE_ADDRESS:-localhost}}
    # IMAGE lets a release job smoke-test the image it just published instead of a
    # locally rebuilt copy. Unset (the normal case) => build from source.
    # `${VAR:-}` with no value yields an empty string, and compose treats that as
    # "no image override", so the default build path is unchanged.
    image: ${IMAGE:-securevoice-ai-app:local}
    restart: unless-stopped
    # The app's own drain: scripts/server-preload.ts flips /api/readyz to 503 so
    # Caddy de-rotates, then waits SHUTDOWN_DRAIN_MS (65s) for accepted requests.
    # Docker's 10s default would kill it mid-window, so a deploy would drop the
    # very requests the drain exists to protect. See
    # tests/unit/shutdown-window.test.ts for the check that keeps these aligned.
    stop_grace_period: 75s
    logging: *default-logging
    mem_limit: 1g
    environment:
      HOSTNAME: 0.0.0.0
      # Built from parts â€” see db-setup for why a whole-URL interpolation is unsafe.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
      # Durable ElevenLabs character meter (10k/month account ceiling). With it
      # unset the guard degrades to a per-process count at a tightened ceiling
      # and logs `degraded: in-process budget limit active`.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Private-network database with no server certificate; see dial-worker.
      DB_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      # Same acknowledgement for the compose redis (src/lib/redis.ts refuses a
      # plaintext REDIS_URL in production otherwise).
      REDIS_ALLOW_PLAINTEXT_PRIVATE_NETWORK: "true"
      # Opt-in: refuse to boot production against anything but the VPS Postgres.
      REQUIRE_VPS_DATABASE: ${REQUIRE_VPS_DATABASE:-false}
      # Internal service name, NEVER localhost: inside the app container,
      # localhost is the app container. Empty = realtime disabled, console uses SSE.
      REALTIME_URL: ${REALTIME_URL:-http://realtime:4000}
      REALTIME_INGEST_SECRET: ${REALTIME_INGEST_SECRET:-}
      # Where the MCP transport forwards tools/call. Always the app's OWN
      # origin — never a request-derived one, which the caller's Host header
      # controls (see .env.example).
      MCP_TOOL_FORWARD_ORIGIN: ${MCP_TOOL_FORWARD_ORIGIN:-http://127.0.0.1:3000}
    env_file:
      - path: .env
        required: false
    expose:
      - "3000"
    depends_on:
      db-setup:
        condition: service_completed_successfully
      realtime:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: the instance must be able to reach its
      # database before it is allowed to take traffic. /api/health stays a pure
      # process probe for uptime monitors.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Reverse proxy â€” the only published port. TLS via Let's Encrypt; certificates
  # and config persist in named volumes so a restart does not re-issue.
  caddy:
    user: "1000:1000"   # non-root
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    cap_add:
      - NET_BIND_SERVICE
    environment:
      # ACME contact for expiry notices. SITE_ADDRESS is deliberately NOT
      # passed to Caddy anymore: it is an APP-level value (canonical origin,
      # Twilio media-stream URL — src/lib/site-origin.ts, src/worker/dial.ts),
      # and Caddy cannot take it as a site address without colliding with the
      # literal blocks in the Caddyfile ("ambiguous site definition",
      # measured). Caddy serves the literal site list; host-local extras come
      # from sites.d/ below.
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    # ── The active colour, for a blue/green deploy ────────────────────────────
    # `APP_UPSTREAM` is what the Caddyfile proxies to, and this file is the only
    # thing that puts it into Caddy's process environment.
    #
    # It lives on the BASE service, not in docker-compose.bluegreen.yml, for a
    # measured reason: an `env_file` declared on the caddy service in the
    # OVERRIDE file is dropped by compose's file merge, so the value never
    # reached the container and a colour flip did nothing. Declared here it is
    # present in both modes — a plain `docker compose up` and a blue/green stack.
    #
    # `required: false` so a fresh checkout with no deploy state still starts;
    # Caddy then falls back to the Caddyfile default (`app:3000`).
    env_file:
      - path: .deploy/active.env
        required: false
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Host-local extra site blocks, imported by the Caddyfile (see
      # sites.d/README.md). Untracked — .gitignore keeps only the README — so
      # a shared edge's extra hostnames live on the machine, never in a commit,
      # and the tracked Caddyfile stays byte-identical everywhere. The import
      # wildcard matching zero files is valid, so a fresh checkout starts clean.
      - ./sites.d:/etc/caddy/sites.d:ro
      - caddy-data:/data      # certificates + ACME account
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      realtime:
        condition: service_started
    healthcheck:
      # Probe the edge itself. Must NOT depend on the ACME cert: before (and
      # during) issuance, :80 answers with a 308â†’https redirect, so accept any
      # HTTP response line as proof Caddy is serving. (The previous check hit
      # the admin API on :2019, which `admin off` disables â€” never healthy.)
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1/healthz 2>&1 | grep -qE 'HTTP/1\\.[01] (200|301|302|307|308)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Opt-in escape hatch for local work: publish the app's :3000 directly and skip
  # TLS. Off by default â€” see the note at the top of this file.
  app-direct:
    profiles: ["direct"]
    build:
      context: .
      target: runner
      args:
        BUILD_DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://securevoiceai.me}
        # Demo shortcut credentials. NEXT_PUBLIC_* is inlined at BUILD time, so
        # omitting these does not merely hide the one-click judge login from
        # src/views/Auth.tsx — it compiles the button out of the bundle. Every
        # service built from this Dockerfile runs the builder stage (which ends
        # in `bun run build`), so every one of them needs the pair.
        NEXT_PUBLIC_DEMO_LOGIN_EMAIL: ${NEXT_PUBLIC_DEMO_LOGIN_EMAIL:-}
        NEXT_PUBLIC_DEMO_LOGIN_PASSWORD: ${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-}
        # Same inlining rule, same consequence: the ids are compiled into the
        # bundle. Without this the pricing page ships without its Buy buttons and
        # `paddlePriceIds()` throws while prerendering — and no runtime .env can
        # fix it, because the value has to be a build arg to exist at all.
        NEXT_PUBLIC_PADDLE_PRICES: ${NEXT_PUBLIC_PADDLE_PRICES:-}
    logging: *default-logging
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-securevoice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securevoice}}
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      db-setup:
        condition: service_completed_successfully

  # Redis — shared pub/sub for Socket.IO across app replicas (WP-20).
  # Without this, a client connected to app replica A never receives an event
  # published on replica B, and the console goes silently stale.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db-data:
  caddy-data:
  caddy-config:

# ---------------------------------------------------------------------------
# The shared front door — an L4 SNI router, and NOTHING else.
#
# This file has no `http {}` block and there will not be one. That is the
# whole design: the front door is a TCP forwarder. It never terminates TLS,
# never parses a request, never sees a header, a URL, a body or a cookie, and
# holds no certificate. The bytes it forwards are the bytes the client sent,
# so the client address, the SNI and the certificate remain the edge's own
# business.
#
# WHY IT EXISTS. Two products used to share ONE Caddy, which made one
# product's deploy the other product's outage (2026-10-21) and gave both a
# capability against each other's containers. Splitting them means two
# Caddys, and two Caddys cannot both bind the host's :443. This is the
# smallest thing that solves that: a name-to-port table and a connection
# forwarder.
#
# WHAT IT DELIBERATELY DOES NOT HAVE:
#   · no TLS termination     — certificates stay with the edge that owns them
#   · no request inspection  — no header, URL or body is ever read
#   · no shared Docker network with any product
#   · no per-project state    — a project's fragment is a MAP, not a service
#
# HOW A NAME REACHES AN EDGE.
#   1. The client opens :443 and sends the SNI in the ClientHello.
#   2. `ssl_preread` reads the SNI out of the ClientHello. It does not
#      decrypt anything, so no key material is involved at this layer.
#   3. The SNI is looked up in the map, and the connection is forwarded to
#      that project's loopback port.
#   4. That project's own Caddy answers — with its own certificate, for its
#      own routes, and logs its own requests.
#
# FAIL-CLOSED. A name that is in no map goes to a closed port on loopback, so
# the connection is refused and the client connection is closed with no
# response. An unrecognised SNI gets no service and no information about
# what is behind this host. The `default` entries below are that blackhole,
# and they are the reason `default` is not a working backend.
#
# HTTP (:80) IS KEYED BY THE HOST HEADER instead, because plain HTTP carries
# no SNI. The ACME HTTP-01 challenge arrives here and is forwarded to the
# edge that owns the name, so Let's Encrypt keeps working unchanged: the
# edge still answers the challenge itself, over its own :80, with its own
# certificate. The HTTP-to-HTTPS redirect also stays where it belongs — in
# the project's own Caddyfile, which is the only place that knows the
# security headers that belong with it.
#
# THE `include` IS THE FEDERATION. Each project ships its own map files into
# `/etc/nginx/edge.d/`, and this file includes the whole directory. Adding a
# name is a change in the project that owns it, reviewed in that project's
# repository — not an edit to a shared file, and not a hand-written file on
# the host.
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

stream {
    # The access log records the CONNECTION, not the request: this layer has
    # no request. `sni=` is the only routing datum, and it is the same datum
    # the map is keyed on.
    log_format edge '$remote_addr [$time_local] $protocol $status '
                     'sni=$ssl_preread_server_name '
                     'sent=$bytes_sent recv=$bytes_received session=$session_time';
    access_log /dev/stdout edge;

    # TLS, keyed by SNI.
    map $ssl_preread_server_name $edge_tls_backend {
        # The blackhole. Port 9 (discard) is reserved and never listening, so
        # the connection is refused and the client is closed with no answer.
        default 127.0.0.1:9;
        include /etc/nginx/edge.d/*.sni.map;
    }

    # Plain HTTP, keyed by the Host header.
    map $host $edge_http_backend {
        default 127.0.0.1:9;
        include /etc/nginx/edge.d/*.host.map;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $edge_tls_backend;
        proxy_connect_timeout 5s;
        # Longer than any edge's own read timeout, because the edges set the
        # real bounds: a websocket and a Twilio media stream have to outlive
        # a call leg, and a media stream does not send anything for seconds
        # at a time. This is the OUTER bound, not the policy.
        proxy_timeout 3600s;
        # NOT `proxy_protocol on`. The backend wants the REAL client
        # address, and src/proxy.ts turns X-Forwarded-For into the
        # rate-limit key and the audit trail. A plain TCP forward preserves
        # the source address on its own; PROXY protocol would encode it too,
        # but no edge reads it, so it would only add a header that is
        # ignored — and an ignored header that looks load-bearing is how a
        # client-IP trust model gets quietly broken later.
        proxy_protocol off;
    }

    server {
        listen 80;
        listen [::]:80;
        proxy_pass $edge_http_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}

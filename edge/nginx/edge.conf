# ---------------------------------------------------------------------------
# The shared front door.
#
# ── What it is ────────────────────────────────────────────────────────────────
#
# Two listeners, and they are deliberately not the same kind of thing.
#
#   :443  A PURE L4 FORWARDER. The client's TLS is never terminated and never
#         parsed. The SNI is read out of the ClientHello — which requires no
#         key material — and the connection is forwarded to the edge that owns
#         that name. Every byte the client sends reaches that edge untouched,
#         and every byte the edge sends reaches the client untouched. The
#         client address, the SNI and the certificate all remain the edge's
#         own business.
#
#   :80   A PLAINTEXT FORWARDER, keyed by the Host header. It exists for two
#         reasons, and it does exactly two things: it forwards the request to
#         the edge that owns the Host, and it lets that edge answer. The edge
#         then does what it did before the split — it redirects to HTTPS with
#         its own security headers, and it answers the ACME HTTP-01 challenge
#         with its own certificate. Nothing about the public behaviour of any
#         name changes.
#
# ── Why the :80 path is HTTP at all ───────────────────────────────────────────
#
# Plain HTTP carries no SNI, so a hostname cannot be read out of a plaintext
# connection without parsing HTTP. That is the whole reason the :80 listener
# is an HTTP listener. It is a deliberate, bounded exception, and the bound
# matters: the TLS path — which is where every cookie, every credential and
# every byte of case data travels — is never parsed by this process.
#
# The alternative was to make this listener do TLS-ALPN-01 instead of HTTP-01
# for certificates, and to generate the HTTP-to-HTTPS redirect here rather
# than in the edge. That would keep the front door 100% L4, at the cost of
# changing the certificate lifecycle and the redirect's headers on a box that
# serves live traffic. The bounded exception was the smaller change.
#
# ── What this deliberately does not have ───────────────────────────────────────
#
#   · no TLS termination     — certificates stay with the edge that owns them
#   · no TLS inspection      — the TLS path parses nothing
#   · no request body        — the :80 path forwards; it never inspects
#   · no shared Docker network with any product
#   · no per-project state    — a project's whole contribution is two map files
#
# ── How a name reaches an edge ────────────────────────────────────────────────
#
#   1. The client opens :443 and sends the SNI.
#   2. `ssl_preread` reads the SNI out of the ClientHello. It does not
#      decrypt anything, so no key material is involved at this layer.
#   3. The SNI is looked up in the map and the connection is forwarded to that
#      project's loopback port.
#   4. That project's own Caddy answers, with its own certificate, for its own
#      routes, and logs its own requests.
#
# ── Fail-closed ───────────────────────────────────────────────────────────────
#
# A name that is in no map is forwarded to a closed port on loopback, so the
# connection is refused and the client connection is closed with no response.
# An unrecognised SNI gets no service and no information about what is behind
# this host. The `default` entries below are that blackhole, and they are the
# reason `default` is never a working backend.
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

# ── the TLS path: pure L4 ──────────────────────────────────────────────────────

stream {
    # The access log records the CONNECTION, not the request: this layer has
    # no request. `sni=` is the only routing datum, and it is the same datum
    # the map is keyed on.
    log_format edge_tls '$remote_addr [$time_local] $protocol $status '
                         'sni=$ssl_preread_server_name '
                         'sent=$bytes_sent recv=$bytes_received session=$session_time';
    access_log /dev/stdout edge_tls;

    # TLS, keyed by SNI.
    map $ssl_preread_server_name $edge_tls_backend {
        # The blackhole. Port 9 (discard) is reserved and never listening, so
        # the connection is refused and the client is closed with no answer.
        default 127.0.0.1:9;
        include /etc/nginx/edge.d/*.sni.map;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $edge_tls_backend;
        proxy_connect_timeout 5s;
        # Longer than any edge's own read timeout, because the edges set the
        # real bounds: a websocket and a Twilio media stream have to outlive
        # a call leg, and a media stream does not send anything for seconds
        # at a time. This is the OUTER bound, not the policy.
        proxy_timeout 3600s;
        # NOT `proxy_protocol on` — and the REASON is a limitation, not a
        # preference. A plain TCP forward does NOT preserve the client
        # address: this server terminates the client connection and opens a
        # NEW one to the edge, so the edge sees 127.0.0.1 as its peer, and
        # Caddy's `{remote_host}` is loopback for every visitor. Preserving
        # the address needs PROXY protocol on this listener AND a
        # proxy_protocol listener wrapper on EVERY edge behind it; enabling
        # it here alone breaks every other project's TLS. That is a
        # coordinated, all-edges cutover (ADR-009), not a change this file
        # can make by itself.
        proxy_protocol off;
    }
}

# ── the plaintext path: keyed by the Host header ───────────────────────────────

http {
    # `$request` carries the query string. This path serves ACME challenges
    # and redirects, so its query strings are not expected to hold secrets —
    # but a log is forever, and `$uri` (path only) costs nothing to use.
    log_format edge_plain '$remote_addr [$time_local] $status $request_method $uri';
    access_log /dev/stdout edge_plain;

    map $host $edge_http_backend {
        default 127.0.0.1:9;
        include /etc/nginx/edge.d/*.host.map;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location / {
            proxy_pass http://$edge_http_backend;
            proxy_http_version 1.1;

            # The edge matches its own site block by Host, so the Host has to
            # survive the hop. Everything else about the request is the
            # edge's business.
            proxy_set_header Host $host;

            # The client's address, for the edges that read it. The edges
            # override X-Forwarded-For with their own {remote_host}, so on
            # this path they will see the loopback address instead — which is
            # harmless, because the only thing this path carries is a
            # redirect and an ACME challenge, and neither is rate-limited or
            # audited per client.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}

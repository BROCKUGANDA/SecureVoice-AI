# Local dev observability scrape config — started by scripts/observability.mjs.
#
# Two jobs, deliberately:
#   · securevoice-dev is what you scrape while `bun dev` is running on this box.
#     It is empty when the dev server is down, and that is not an outage.
#   · securevoice-production is a read-only GET against the live origin's
#     /api/metrics, which is designed to be scraped (fixed label vocabulary, no
#     customer data, every collector individually guarded, cheap enough for 15s).
#     Delete the job if you would rather a laptop never touch production.
#
# OTLP metrics arrive on http://127.0.0.1:9090/api/v1/otlp/v1/metrics because
# prometheus runs with --web.enable-otlp-receiver. That receiver is METRICS ONLY:
# POSTing /otlp/v1/traces returns 404, which is why traces need a real backend.
global:
  scrape_interval: 15s
  external_labels:
    stack: securevoice-local

scrape_configs:
  - job_name: securevoice-dev
    metrics_path: /api/metrics
    static_configs:
      - targets: ["127.0.0.1:3000"]

  - job_name: securevoice-production
    scrape_interval: 60s
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets: ["securevoiceai.me"]

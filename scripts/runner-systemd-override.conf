[Unit]
# A restart every 10 s must never trip the unit's own start rate limit and drop it back
# into `failed` — that is the state this override exists to prevent.
StartLimitIntervalSec=0

[Service]
# The generated GitHub runner unit ships no Restart= at all. On 2026-10-19 the kernel
# OOM killer killed this runner mid "Compose stack smoke test"; runsvc.sh then exited 0,
# logged "stop the service, no retry needed", and systemd left the unit in `failed` for
# over nine hours — half the fleet's capacity gone, with the promotion queue parked and
# no signal but a runner listed `offline`.
#
# OOMPolicy=continue is the part that matters: without it an OOM kill of any process in
# the unit puts the unit in `failed` regardless of Restart=. Restart=always covers the
# rest (a job that takes the listener down with it, a non-zero exit, a crash).
Restart=always
RestartSec=10
OOMPolicy=continue
